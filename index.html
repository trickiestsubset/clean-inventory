<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Clean Inventory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f2f3ef;
    --surface: #ffffff;
    --surface-2: #eceee9;
    --ink: #1b1f1c;
    --muted: #5c655e;
    --faint: #8a9189;
    --line: #d8dcd4;
    --accent: #c9670f;
    --accent-ink: #ffffff;
    --accent-wash: #f5e2cd;
    --danger: #ab3427;
    --danger-wash: #f8e2de;
    --good: #3d7a44;
    --radius-sm: 4px;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(20, 24, 20, 0.06), 0 1px 1px rgba(20, 24, 20, 0.04);
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15170f;
      --surface: #1d201a;
      --surface-2: #262a21;
      --ink: #edeee7;
      --muted: #a3ab9c;
      --faint: #737a6d;
      --line: #343a2d;
      --accent: #ef9a3c;
      --accent-ink: #1b1400;
      --accent-wash: #3a2c14;
      --danger: #e08277;
      --danger-wash: #3a201c;
      --good: #7cbf7f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15170f;
    --surface: #1d201a;
    --surface-2: #262a21;
    --ink: #edeee7;
    --muted: #a3ab9c;
    --faint: #737a6d;
    --line: #343a2d;
    --accent: #ef9a3c;
    --accent-ink: #1b1400;
    --accent-wash: #3a2c14;
    --danger: #e08277;
    --danger-wash: #3a201c;
    --good: #7cbf7f;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-weight: 600; text-wrap: balance; margin: 0; }
  a { color: inherit; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  input, select, textarea {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.55em 0.7em;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button { cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4em;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 0.55em 0.9em; font-weight: 600; font-size: 0.92em;
    background: var(--surface-2); color: var(--ink); text-decoration: none;
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(1px); }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-ink { background: var(--ink); color: var(--bg); }
  .btn-ghost { background: transparent; border-color: var(--line); }
  .btn-danger { background: var(--danger-wash); color: var(--danger); }
  .btn-sm { padding: 0.35em 0.6em; font-size: 0.85em; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .label-eyebrow {
    font-family: var(--font-mono); font-size: 0.72em; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted);
  }
  .qty {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .qty-stencil {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.6em; padding: 0.25em 0.4em;
    border: 1.5px solid var(--ink); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-weight: 700; font-size: 1.05em;
    font-variant-numeric: tabular-nums;
  }
  .qty-zero { color: var(--faint); border-color: var(--line); }

  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(45deg, var(--surface-2) 0, var(--surface-2) 1px, transparent 1px, transparent 14px);
  }
  .gate-card {
    width: 100%; max-width: 340px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 26px;
  }
  .gate-mark {
    font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.02em;
    font-size: 1.3em; display: flex; align-items: center; gap: 0.4em; margin-bottom: 4px;
  }
  .gate-mark .dot { width: 0.55em; height: 0.55em; border-radius: 2px; background: var(--accent); display: inline-block; }
  .gate-sub { color: var(--muted); font-size: 0.9em; margin: 0 0 20px; }
  .gate-error { color: var(--danger); font-size: 0.85em; margin-top: 10px; min-height: 1.2em; }

  header.app-header {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto; padding: 0 18px;
    height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .wordmark {
    font-family: var(--font-mono); font-weight: 700; font-size: 1.02em;
    display: flex; align-items: center; gap: 0.45em; text-decoration: none; white-space: nowrap;
  }
  .wordmark .dot { width: 0.5em; height: 0.5em; border-radius: 2px; background: var(--accent); display: inline-block; }
  nav.main-nav { display: flex; gap: 4px; align-items: center; }
  nav.main-nav a, nav.main-nav button {
    font-size: 0.88em; padding: 0.5em 0.7em; border-radius: var(--radius-sm);
    text-decoration: none; color: var(--muted); background: none; border: none; font-weight: 600;
  }
  nav.main-nav a.active, nav.main-nav a:hover, nav.main-nav button:hover { color: var(--ink); background: var(--surface-2); }

  main.app-main { max-width: 900px; margin: 0 auto; padding: 28px 18px 80px; }
  .view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .crumb { color: var(--muted); font-size: 0.85em; margin-bottom: 6px; }
  .crumb a:hover { color: var(--ink); text-decoration: underline; }
  .section-title {
    font-family: var(--font-mono); font-size: 0.75em; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 28px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px;
  }
  .form-grid { display: grid; gap: 10px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-row > * { flex: 1; min-width: 140px; }

  .loc-parts-row { display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap; }
  .loc-part-field { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .loc-part-label {
    font-family: var(--font-mono); font-size: 0.7em; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); text-align: center;
  }
  .loc-part-input {
    width: 3.4em; text-align: center; text-transform: uppercase;
    font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.04em;
  }
  .loc-part-sep { color: var(--faint); font-weight: 700; padding-bottom: 0.6em; }
  .hint { color: var(--faint); font-size: 0.82em; }
  .msg-banner {
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.9em; margin-bottom: 16px;
    background: var(--danger-wash); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
  }

  .ledger { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .ledger-row {
    display: flex; gap: 14px; align-items: center; padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .ledger-row:first-child { border-top: 1px solid var(--line); }
  .thumb {
    width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .thumb-empty {
    width: 48px; height: 48px; border-radius: var(--radius-sm); flex-shrink: 0;
    border: 1px dashed var(--line); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 1.3em;
  }
  .ledger-main { flex: 1; min-width: 0; }
  .ledger-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .ledger-name { font-weight: 600; text-decoration: none; }
  .ledger-name:hover { text-decoration: underline; }
  .ledger-sku { color: var(--faint); font-family: var(--font-mono); font-size: 0.78em; }
  .ledger-actions { display: flex; gap: 6px; margin-top: 8px; }
  .qty-input { width: 3.6em; padding: 0.35em 0.5em; text-align: center; font-family: var(--font-mono); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .loc-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    text-decoration: none;
  }
  .loc-card:hover { border-color: var(--accent); }
  .qr-box { background: #fff; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--line); }
  .loc-name { font-weight: 600; }
  .loc-notes { color: var(--muted); font-size: 0.85em; }

  .part-card {
    display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; text-decoration: none;
  }
  .part-card:hover { border-color: var(--accent); }
  .part-total { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }

  .empty-state { color: var(--muted); font-size: 0.92em; padding: 18px 4px; }

  .status-badge {
    display: inline-block; padding: 0.2em 0.7em; border-radius: 999px; border: 1.5px solid currentColor;
    font-family: var(--font-mono); font-size: 0.78em; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; white-space: nowrap;
  }
  .status-open { color: var(--accent); }
  .status-picked, .status-packed, .status-staging { color: var(--ink); }
  .status-backordered { color: var(--muted); border-style: dashed; }
  .status-closed { color: var(--good); }
  .status-cancelled { color: var(--danger); }
  .order-meta { margin: 6px 0 18px; }
  .order-meta .order-customer { font-size: 1.1em; font-weight: 600; }
  .order-meta .order-address { color: var(--muted); white-space: pre-line; }
  .order-loc-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .order-loc {
    font-family: var(--font-mono); font-size: 0.82em; font-weight: 600; text-decoration: none;
    padding: 0.15em 0.55em; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2);
  }
  a.order-loc:hover { border-color: var(--accent); }
  .order-short { color: var(--danger); font-size: 0.82em; margin-top: 4px; }
  .barcode-box { display: inline-block; background: #fff; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line); }
  .barcode-box svg { display: block; max-width: 100%; height: auto; }
  .order-list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; }
  .order-list-row:first-child { border-top: 1px solid var(--line); }
  .order-list-row:hover .ledger-name { text-decoration: underline; }
  .staging-loc { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-weight: 700; font-size: 1.3em; }
  .staging-loc input { width: 3.2em; text-align: center; text-transform: uppercase; font-family: var(--font-mono); font-weight: 700; font-size: 1em; }
  .pack-row { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; }
  .pack-row .pack-name { flex: 1; min-width: 0; font-weight: 600; }
  .pack-row .pack-qty { width: 5em; text-align: center; font-family: var(--font-mono); font-weight: 700; }
  .pack-row.bad { border-color: var(--danger); background: var(--danger-wash); }
  .pack-row.bad .pack-qty { border: 2px solid var(--danger); background: var(--surface); }

  .toast-wrap { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--radius-sm);
    font-size: 0.88em; box-shadow: var(--shadow); animation: toast-in 0.15s ease-out;
  }
  .toast.err { background: var(--danger); color: #fff; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }

  .activity-list { list-style: none; margin: 0; padding: 0; }
  .activity-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 0.87em; }
  .activity-row:last-child { border-bottom: none; }
  .activity-delta { font-family: var(--font-mono); font-weight: 700; }
  .activity-delta.pos { color: var(--good); }
  .activity-delta.neg { color: var(--danger); }

  .photo-input-row { display: flex; align-items: center; gap: 10px; }
  .photo-preview { width: 44px; height: 44px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--line); display: none; }

  [hidden] { display: none !important; }

  .scan-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: 60px;
    display: flex; align-items: center; justify-content: center; gap: 0.5em;
    background: var(--accent); color: var(--accent-ink); border: none; border-top: 1px solid var(--line);
    font-weight: 600; font-size: 1.05em; box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.08);
  }
  .scan-bar:hover { filter: brightness(1.1); }
  .scan-bar svg { width: 1.3em; height: 1.3em; flex-shrink: 0; }
  .scan-bar-label { font-size: 1.3em; }

  .scan-modal-backdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(10, 12, 8, 0.6);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .scan-modal {
    width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  }
  .scan-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .scan-video-wrap {
    position: relative; border-radius: var(--radius-sm); overflow: hidden;
    background: #000; aspect-ratio: 1 / 1;
  }
  .scan-video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-reticle {
    position: absolute; inset: 14%;
    box-shadow: 0 0 0 999px rgba(0,0,0,0.25);
  }
  .scan-reticle .reticle-corner {
    position: absolute; width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.85);
  }
  .scan-reticle .reticle-corner-tl { top: 6%; left: 6%; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
  .scan-reticle .reticle-corner-tr { top: 6%; right: 6%; border-width: 3px 3px 0 0; border-radius: 0 6px 0 0; }
  .scan-reticle .reticle-corner-bl { bottom: 6%; left: 6%; border-width: 0 0 3px 3px; border-radius: 0 0 0 6px; }
  .scan-reticle .reticle-corner-br { bottom: 6%; right: 6%; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }
  .scan-reticle .reticle-line {
    position: absolute; top: 50%; left: 16%; right: 16%; height: 2px;
    background: #ef4444; transform: translateY(-50%);
    box-shadow: 0 0 6px rgba(239, 68, 68, 0.9);
  }
  .scan-status { margin: 12px 0 0; font-size: 0.85em; color: var(--muted); min-height: 1.3em; }
  .scan-manual { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-top: 12px; }
  .scan-manual > input { flex: 1; }
  .flow-error { color: var(--danger); font-size: 0.85em; min-height: 1.2em; margin: 0; }

  @media print {
    header.app-header, .no-print { display: none !important; }
    body { background: #fff; }
    main.app-main { padding: 0; max-width: none; }
    .print-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .print-tile { break-inside: avoid; text-align: center; border: 1px dashed #999; padding: 14px; }
  }
</style>

<div id="gate">
  <div class="gate-card">
    <div class="gate-mark"><span class="dot"></span>Clean Inventory</div>
    <p class="gate-sub">Enter the shared passcode to open the shop inventory.</p>
    <form id="gate-form" class="form-grid">
      <input id="gate-input" type="password" placeholder="Passcode" autocomplete="off" autofocus required />
      <button type="submit" class="btn btn-accent">Unlock</button>
      <div class="gate-error" id="gate-error"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="app-header">
    <div class="header-inner">
      <a href="#/" class="wordmark"><span class="dot"></span>Clean Inventory</a>
      <nav class="main-nav" id="main-nav">
        <a href="#/parts" data-route="parts">Parts</a>
        <a href="#/orders" data-route="orders">Orders</a>
        <a href="#/locations" data-route="locations">Setup</a>
      </nav>
    </div>
  </header>
  <main class="app-main" id="view"></main>

  <button class="scan-bar" id="scan-fab" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
      <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
      <rect x="7" y="7" width="10" height="10" rx="1"/>
    </svg>
    <span class="scan-bar-label">Scan</span>
  </button>

  <div class="scan-modal-backdrop" id="cycle-modal" hidden>
    <div class="scan-modal">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;">Cycle count</h2>
        <button class="btn btn-accent btn-sm" id="cycle-close" type="button">Close</button>
      </div>
      <div id="cycle-body"></div>
    </div>
  </div>

  <div class="scan-modal-backdrop" id="pack-modal" hidden>
    <div class="scan-modal" style="max-height:90vh; overflow-y:auto;">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;" id="pack-title">Packing</h2>
        <button class="btn btn-accent btn-sm" id="pack-close" type="button">Close</button>
      </div>
      <div id="pack-body"></div>
    </div>
  </div>

  <div class="scan-modal-backdrop" id="staging-modal" hidden>
    <div class="scan-modal">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;" id="staging-title">Staging</h2>
        <button class="btn btn-accent btn-sm" id="staging-close" type="button">Close</button>
      </div>
      <div id="staging-body"></div>
    </div>
  </div>

  <div class="scan-modal-backdrop" id="close-modal" hidden>
    <div class="scan-modal" style="max-height:90vh; overflow-y:auto;">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;" id="close-title">Close orders</h2>
        <button class="btn btn-accent btn-sm" id="close-close" type="button">Cancel</button>
      </div>
      <div id="close-body"></div>
    </div>
  </div>

  <div class="scan-modal-backdrop" id="flow-modal" hidden>
    <div class="scan-modal">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;" id="flow-title"></h2>
        <button class="btn btn-accent btn-sm" id="flow-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="flow-body"></div>
    </div>
  </div>

  <div class="scan-modal-backdrop" id="scan-modal" hidden>
    <div class="scan-modal">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;" id="scan-title">Scan a location's QR code</h2>
        <button class="btn btn-accent btn-sm" id="scan-close" type="button">Close</button>
      </div>
      <div class="scan-video-wrap">
        <video id="scan-video" playsinline autoplay muted></video>
        <div class="scan-reticle" id="scan-reticle">
          <span class="reticle-corner reticle-corner-tl"></span>
          <span class="reticle-corner reticle-corner-tr"></span>
          <span class="reticle-corner reticle-corner-bl"></span>
          <span class="reticle-corner reticle-corner-br"></span>
          <span class="reticle-line"></span>
        </div>
      </div>
      <p class="scan-status" id="scan-status">Requesting camera access…</p>
      <form class="scan-manual" id="scan-manual-form">
        <div class="loc-parts-row">
          <label class="loc-part-field"><span class="loc-part-label">Section</span><input type="text" id="scan-manual-section" class="loc-part-input" maxlength="1" placeholder="X" autocomplete="off" /></label>
          <span class="loc-part-sep">–</span>
          <label class="loc-part-field"><span class="loc-part-label">Aisle</span><input type="text" id="scan-manual-aisle" class="loc-part-input" maxlength="2" placeholder="XX" autocomplete="off" /></label>
          <span class="loc-part-sep">–</span>
          <label class="loc-part-field"><span class="loc-part-label">Bay</span><input type="text" id="scan-manual-bay" class="loc-part-input" maxlength="2" placeholder="XX" autocomplete="off" /></label>
          <span class="loc-part-sep">–</span>
          <label class="loc-part-field"><span class="loc-part-label">Shelf</span><input type="text" id="scan-manual-shelf" class="loc-part-input" maxlength="2" placeholder="XX" autocomplete="off" /></label>
        </div>
        <button class="btn btn-accent btn-sm" type="submit">Go</button>
      </form>
      <form class="scan-manual" id="barcode-manual-form" hidden>
        <input type="text" id="barcode-manual-input" placeholder="Enter UPC / part number" autocomplete="off" />
        <button class="btn btn-accent btn-sm" type="submit">Use this</button>
      </form>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
(function () {
  "use strict";

  // ---------- app state (must be assigned before anything can call boot()/render(), including
  // the immediate "already unlocked" check below) ----------
  var db = null;
  var state = {
    locations: [],
    parts: [],
    inventory: [],
    orders: [],
    ready: { locations: false, parts: false, inventory: false, orders: false }
  };

  // ---------- Supabase config (same reasoning — must precede the early unlock check) ----------
  var SUPABASE_URL = "https://iyumqmcwuosajgnhqyhy.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_bN2qxXdk7vT3po8KwSIL2w_pp3GM5PA";

  var SUPABASE_FIELDS = {
    locations: { code: "code", name: "name", section: "section", aisle: "aisle", bay: "bay", shelf: "shelf", notes: "notes", createdAt: "created_at", recentActivity: "recent_activity" },
    parts: { name: "name", sku: "sku", description: "description", photoDataUrl: "photo_data_url", createdAt: "created_at", recentActivity: "recent_activity" },
    inventory: { locationId: "location_id", partId: "part_id", quantity: "quantity", updatedAt: "updated_at" },
    orders: { orderNumber: "order_number", customerName: "customer_name", address: "address", status: "status", lines: "lines", parentOrder: "parent_order", stagingLocation: "staging_location", packages: "packages", createdAt: "created_at", updatedAt: "updated_at" }
  };

  // ---------- passcode gate ----------
  var PASSCODE_HASH = "efa3a6980f12158bcb1d88e68552174acf74807034c4ffe886826d310d8a654d"; // sha256("shiny0830")
  var UNLOCK_KEY = "ci_unlocked_v1";

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    });
  }

  function showApp() {
    document.getElementById("gate").hidden = true;
    var app = document.getElementById("app");
    app.hidden = false;
    boot();
  }

  document.getElementById("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var val = document.getElementById("gate-input").value;
    sha256Hex(val).then(function (hash) {
      if (hash === PASSCODE_HASH) {
        try { localStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {}
        showApp();
      } else {
        document.getElementById("gate-error").textContent = "That passcode isn't right. Try again.";
      }
    });
  });

  // Passcode gate temporarily disabled — security approach will change later.
  // (Gate markup/logic above is left in place so it's easy to re-enable.)
  showApp();

  function isReady() { return state.ready.locations && state.ready.parts && state.ready.inventory && state.ready.orders; }

  function toast(msg, isErr) {
    var wrap = document.getElementById("toasts");
    var el = document.createElement("div");
    el.className = "toast" + (isErr ? " err" : "");
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function genCode(len) {
    var chars = "abcdefghjkmnpqrstuvwxyz23456789";
    var s = "";
    for (var i = 0; i < (len || 6); i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function locationUrl(code) {
    var url = new URL(window.location.href);
    url.hash = "#/l/" + code;
    return url.toString();
  }

  // ---------- data helpers ----------
  function getLocationByCode(code) {
    return state.locations.find(function (l) { return l.code === code; });
  }
  function getLocationById(id) {
    return state.locations.find(function (l) { return l.id === id; });
  }
  function getPart(id) {
    return state.parts.find(function (p) { return p.id === id; });
  }
  function getPartBySku(sku) {
    var s = (sku || "").trim().toLowerCase();
    if (!s) return null;
    return state.parts.find(function (p) { return (p.sku || "").trim().toLowerCase() === s; });
  }
  function invRow(locationId, partId) {
    return state.inventory.find(function (i) { return i.locationId === locationId && i.partId === partId; });
  }
  function inventoryForLocation(locationId) {
    return state.inventory
      .filter(function (i) { return i.locationId === locationId && i.quantity > 0; })
      .map(function (i) { return Object.assign({}, i, { part: getPart(i.partId) }); })
      .filter(function (r) { return r.part; })
      .sort(function (a, b) { return a.part.name.localeCompare(b.part.name); });
  }
  function locationsForPart(partId) {
    return state.inventory
      .filter(function (i) { return i.partId === partId && i.quantity > 0; })
      .map(function (i) { return { location: state.locations.find(function (l) { return l.id === i.locationId; }), quantity: i.quantity }; })
      .filter(function (r) { return r.location; })
      .sort(function (a, b) { return a.location.name.localeCompare(b.location.name); });
  }
  function totalForPart(partId) {
    return state.inventory.filter(function (i) { return i.partId === partId; }).reduce(function (s, i) { return s + i.quantity; }, 0);
  }

  // ---------- mutations ----------
  function applyChange(locationId, partId, delta, reason) {
    var invId = locationId + "__" + partId;
    var ref = db.doc("inventory/" + invId);
    return ref.get().then(function (snap) {
      var current = snap.exists ? (snap.data().quantity || 0) : 0;
      var next = current + delta;
      if (next < 0) {
        toast("Only " + current + " in stock — can't pull " + Math.abs(delta) + ".", true);
        return false;
      }
      return ref.set({ locationId: locationId, partId: partId, quantity: next, updatedAt: Date.now() }).then(function () {
        logActivity(locationId, partId, delta, reason);
        noteInventory(locationId, partId, next);
        if (delta > 0) fillBackorders();
        return true;
      });
    }).catch(function (e) {
      toast("Couldn't save that change: " + e.message, true);
      return false;
    });
  }

  function logActivity(locationId, partId, delta, reason) {
    var loc = state.locations.find(function (l) { return l.id === locationId; });
    var part = getPart(partId);
    var locRef = db.doc("locations/" + locationId);
    var partRef = db.doc("parts/" + partId);
    locRef.get().then(function (snap) {
      var arr = (snap.exists && snap.data().recentActivity) || [];
      arr = [{ ts: Date.now(), delta: delta, reason: reason, otherName: part ? part.name : "Part" }].concat(arr).slice(0, 15);
      return locRef.update({ recentActivity: arr });
    }).catch(function () {});
    partRef.get().then(function (snap) {
      var arr = (snap.exists && snap.data().recentActivity) || [];
      arr = [{ ts: Date.now(), delta: delta, reason: reason, otherName: loc ? loc.name : "Location" }].concat(arr).slice(0, 15);
      return partRef.update({ recentActivity: arr });
    }).catch(function () {});
  }

  function locationLabel(section, aisle, bay, shelf) {
    return [section, aisle, bay, shelf].map(function (s) { return String(s || "").toUpperCase(); }).join("-");
  }

  function createLocation(section, aisle, bay, shelf, notes) {
    if (getLocationByParts(section, aisle, bay, shelf)) {
      toast("That location already exists.", true);
      return Promise.resolve();
    }
    var name = locationLabel(section, aisle, bay, shelf);
    return db.collection("locations").add({
      code: genCode(6), name: name,
      section: section.toUpperCase(), aisle: aisle.toUpperCase(), bay: bay.toUpperCase(), shelf: shelf.toUpperCase(),
      notes: notes || null, createdAt: Date.now(), recentActivity: []
    }).then(function () { toast("Location created."); }).catch(function (e) { toast(e.message, true); });
  }

  function deleteLocation(locationId) {
    var loc = getLocationById(locationId);
    if (!loc) return;
    var stocked = inventoryForLocation(locationId);
    if (stocked.length) {
      toast("Move every part out of " + loc.name + " before deleting it (" + stocked.length + " part" + (stocked.length === 1 ? "" : "s") + " still stocked there).", true);
      return;
    }
    if (!window.confirm('Delete "' + loc.name + '"? This can\'t be undone.')) return;
    db.doc("locations/" + locationId).delete().then(function () {
      toast("Deleted " + loc.name + ".");
    }).catch(function (e) {
      toast("Couldn't delete that location: " + e.message, true);
    });
  }

  function deletePart(partId) {
    var part = getPart(partId);
    if (!part) return;
    var stocked = locationsForPart(partId);
    if (stocked.length) {
      toast("Pull " + part.name + " from every location before deleting it (still stocked in " + stocked.length + " location" + (stocked.length === 1 ? "" : "s") + ").", true);
      return;
    }
    if (!window.confirm('Delete "' + part.name + '"? This can\'t be undone.')) return;
    db.doc("parts/" + partId).delete().then(function () {
      toast("Deleted " + part.name + ".");
      window.location.hash = "#/parts";
    }).catch(function (e) {
      toast("Couldn't delete that part: " + e.message, true);
    });
  }

  function getPartByName(name) {
    var n = (name || "").trim().toLowerCase();
    if (!n) return null;
    return state.parts.find(function (p) { return (p.name || "").trim().toLowerCase() === n; });
  }

  function createPart(name, sku, description, photoDataUrl) {
    if (getPartByName(name)) {
      toast("A part named \"" + name.trim() + "\" already exists.", true);
      return Promise.resolve();
    }
    if (sku && getPartBySku(sku)) {
      toast("A part with SKU \"" + sku.trim() + "\" already exists.", true);
      return Promise.resolve();
    }
    return db.collection("parts").add({
      name: name, sku: sku || null, description: description || null,
      photoDataUrl: photoDataUrl || null, createdAt: Date.now(), recentActivity: []
    }).then(function (ref) { toast("Part added."); return ref; }).catch(function (e) { toast(e.message, true); });
  }

  function updatePart(id, fields) {
    return db.doc("parts/" + id).update(fields).then(function () { toast("Saved."); }).catch(function (e) { toast(e.message, true); });
  }

  // ---------- photo compression ----------
  function compressImage(file) {
    var attempts = [[480, 0.6], [360, 0.5], [260, 0.45]];
    function tryOne(i) {
      var maxDim = attempts[i][0], quality = attempts[i][1];
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var w = img.width, h = img.height;
            if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
            else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
            var canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      }).then(function (dataUrl) {
        if (dataUrl.length > 170000 && i < attempts.length - 1) return tryOne(i + 1);
        if (dataUrl.length > 170000) throw new Error("too big");
        return dataUrl;
      });
    }
    return tryOne(0);
  }

  function wirePhotoInput(input) {
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      var preview = input.parentElement.querySelector(".photo-preview");
      if (!file) return;
      input.disabled = true;
      compressImage(file).then(function (dataUrl) {
        input.dataset.compressed = dataUrl;
        if (preview) { preview.src = dataUrl; preview.style.display = "inline-block"; }
      }).catch(function () {
        toast("That photo is too large — try a smaller or simpler photo.", true);
        input.value = "";
      }).finally(function () { input.disabled = false; });
    });
  }

  // ---------- orders ----------
  // An order is a pick request: who it's for, and which parts (and how many) to send them.
  // Lines are { partId, quantity } and live on the order itself; where each part currently
  // sits is looked up from live inventory, never stored, so it can't go stale.
  var ORDER_STATUSES = [
    { key: "open", label: "Open" },
    { key: "backordered", label: "Backordered" },
    { key: "picked", label: "Picked" },
    { key: "packed", label: "Packed" },
    { key: "staging", label: "Staging" },
    { key: "closed", label: "Closed" },
    { key: "cancelled", label: "Cancelled" }
  ];
  var ORDER_PREFIX = "SO-"; // the hyphen keeps order barcodes from ever being mistaken for a location code
  var orderDraft = { orderNumber: null, customerName: "", address: "", lines: [] };

  function orderStatusLabel(key) {
    var st = ORDER_STATUSES.find(function (x) { return x.key === key; });
    return st ? st.label : "Open";
  }
  function statusBadge(key) {
    return '<span class="status-badge status-' + esc(key || "open") + '">' + esc(orderStatusLabel(key)) + '</span>';
  }

  // loose = also accept just the digits ("1001" -> "SO-1001"); only for typed lookups, never scans.
  function getOrderByNumber(num, loose) {
    var n = (num || "").trim().toLowerCase();
    if (!n) return null;
    var found = state.orders.find(function (o) { return (o.orderNumber || "").toLowerCase() === n; });
    if (!found && loose && /^\d+$/.test(n)) {
      found = state.orders.find(function (o) { return (o.orderNumber || "").toLowerCase() === ORDER_PREFIX.toLowerCase() + n; });
    }
    return found || null;
  }

  function nextOrderNumber() {
    var max = 1000;
    state.orders.forEach(function (o) {
      var m = /^SO-(\d+)$/i.exec(o.orderNumber || "");
      if (m) max = Math.max(max, Number(m[1]));
    });
    return ORDER_PREFIX + (max + 1);
  }

  // ---------- stock availability & backorders ----------
  // Stock already promised to Open orders is reserved, less whatever has already been pulled for
  // them (a line's "picked" count). Picked and later statuses no longer count against the shelf,
  // and a Backordered order is just waiting, so it holds nothing.
  function reservedForPart(partId) {
    return state.orders.reduce(function (sum, o) {
      if (o.status !== "open") return sum;
      return sum + (o.lines || []).reduce(function (s2, ln) { return ln.partId === partId ? s2 + Math.max(0, ln.quantity - (ln.picked || 0)) : s2; }, 0);
    }, 0);
  }
  function availableForPart(partId) {
    return Math.max(0, totalForPart(partId) - reservedForPart(partId));
  }

  // A backorder is its own order, named <original>.<n>, counting up per original order.
  function nextBackorderNumber(rootNumber) {
    var max = 0, prefix = rootNumber + ".";
    state.orders.forEach(function (o) {
      var n = o.orderNumber || "";
      if (n.indexOf(prefix) === 0 && /^\d+$/.test(n.slice(prefix.length))) max = Math.max(max, Number(n.slice(prefix.length)));
    });
    return prefix + (max + 1);
  }

  function createOrder(number, customerName, address, lines) {
    if (!number) { toast("An order needs an order number.", true); return Promise.resolve(null); }
    if (!customerName) { toast("An order needs a customer name.", true); return Promise.resolve(null); }
    if (!lines.length) { toast("Add at least one part to the order.", true); return Promise.resolve(null); }
    if (getOrderByNumber(number)) {
      toast("Order " + number + " already exists.", true);
      return Promise.resolve(null);
    }
    var now = Date.now();
    return db.collection("orders").add({
      orderNumber: number, customerName: customerName, address: address || null,
      status: "open", lines: lines, createdAt: now, updatedAt: now
    }).then(function () {
      toast("Order " + number + " created.");
      return number;
    }).catch(function (e) {
      toast("Couldn't create that order: " + e.message, true);
      return null;
    });
  }

  // Put `qty` of a part on a new <original>.<n> order that waits as Backordered until stock arrives.
  function createBackorderOrder(order, partId, qty) {
    var root = order.parentOrder || order.orderNumber;
    var now = Date.now();
    var child = {
      orderNumber: nextBackorderNumber(root), customerName: order.customerName, address: order.address || null,
      status: "backordered", lines: [{ partId: partId, quantity: qty }], parentOrder: root, createdAt: now, updatedAt: now
    };
    return db.collection("orders").add(child).then(function (ref) {
      state.orders.push(Object.assign({ id: ref && ref.id }, child));
      return child;
    });
  }

  // Applies the change locally right away and redraws; if the save fails, puts the order back the
  // way it was (so the screen never disagrees with what's actually stored) and re-throws.
  function saveOrderFields(order, fields) {
    var now = Date.now();
    var before = { updatedAt: order.updatedAt };
    Object.keys(fields).forEach(function (k) { before[k] = order[k]; });
    Object.assign(order, fields, { updatedAt: now });
    scheduleRender();
    return db.doc("orders/" + order.id).update(Object.assign({}, fields, { updatedAt: now })).catch(function (e) {
      Object.assign(order, before);
      scheduleRender();
      throw e;
    });
  }

  function allLinesPicked(lines) {
    return lines.length > 0 && lines.every(function (l) { return (l.picked || 0) >= l.quantity; });
  }

  // Take `qty` of a line's still-to-pick quantity off the order and backorder it. The rest of the
  // order carries on as normal; if nothing is left on it, there's nothing for it to do, so it closes.
  function backorderOrderLine(order, partId, qty) {
    var lines = (order.lines || []).map(function (l) { return Object.assign({}, l); });
    var line = lines.find(function (l) { return l.partId === partId; });
    if (!line || qty <= 0) return Promise.resolve();
    line.quantity -= qty;
    if (line.quantity <= 0) lines = lines.filter(function (l) { return l !== line; });
    var fields = { lines: lines };
    if (!lines.length) fields.status = "closed";
    else if (order.status === "open" && allLinesPicked(lines)) fields.status = "picked";
    return createBackorderOrder(order, partId, qty).then(function () {
      return saveOrderFields(order, fields);
    }).catch(function (e) {
      toast("Couldn't backorder that: " + e.message, true);
    });
  }

  // After parts are pulled for an order line: count them as picked, and optionally backorder
  // whatever of that line is still outstanding.
  function recordOrderPick(orderId, partId, qty, backorderRest) {
    var order = state.orders.find(function (o) { return o.id === orderId; });
    if (!order) return Promise.resolve();
    var lines = (order.lines || []).map(function (l) { return Object.assign({}, l); });
    var line = lines.find(function (l) { return l.partId === partId; });
    if (!line) return Promise.resolve();
    line.picked = (line.picked || 0) + qty;
    var rest = line.quantity - line.picked;
    var pickFields = { lines: lines };
    if (order.status === "open" && allLinesPicked(lines)) pickFields.status = "picked";
    return saveOrderFields(order, pickFields).then(function () {
      if (backorderRest && rest > 0) return backorderOrderLine(order, partId, rest);
    }).catch(function (e) {
      toast("Couldn't save that pick: " + e.message, true);
    });
  }

  // Run after stock goes up. Backordered orders (oldest first) become Open, and so pickable, once
  // their part is in stock. If only some of it is, that much becomes Open and the rest stays
  // behind as a new <original>.<n> backorder.
  var backorderBusy = false, backorderAgain = false;
  function fillBackorders() {
    if (backorderBusy) { backorderAgain = true; return Promise.resolve(); }
    backorderBusy = true;
    var waiting = state.orders
      .filter(function (o) { return o.status === "backordered"; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });

    return waiting.reduce(function (chain, order) {
      return chain.then(function () {
        var fill = [], remaining = [];
        (order.lines || []).forEach(function (ln) {
          var take = Math.min(ln.quantity, availableForPart(ln.partId));
          if (take > 0) fill.push({ partId: ln.partId, quantity: take });
          if (ln.quantity > take) remaining.push({ partId: ln.partId, quantity: ln.quantity - take });
        });
        if (!fill.length) return;
        // Open it locally right away so the next order in this pass sees the reservation.
        var before = { lines: order.lines, status: order.status };
        var split = Promise.resolve();
        if (remaining.length) {
          split = remaining.reduce(function (c, ln) {
            return c.then(function () { return createBackorderOrder(order, ln.partId, ln.quantity); });
          }, Promise.resolve());
        }
        return split.then(function () {
          return saveOrderFields(order, { lines: fill, status: "open" });
        }).then(function () {
          toast(order.orderNumber + " is ready to pick.");
        }).catch(function (e) {
          Object.assign(order, before);
          toast("Couldn't update backorder " + order.orderNumber + ": " + e.message, true);
        });
      });
    }, Promise.resolve()).then(function () {
      backorderBusy = false;
      if (backorderAgain) { backorderAgain = false; return fillBackorders(); }
    }, function () { backorderBusy = false; });
  }

  // The local inventory cache only catches up when the realtime event arrives; patch it as soon
  // as we write so a backorder check right after a write sees the new quantity.
  function noteInventory(locationId, partId, qty) {
    var row = invRow(locationId, partId);
    if (row) row.quantity = qty;
    else state.inventory.push({ id: locationId + "__" + partId, locationId: locationId, partId: partId, quantity: qty, updatedAt: Date.now() });
  }

  // ---------- routing ----------
  function currentRoute() {
    var h = window.location.hash.replace(/^#\/?/, "");
    return h.split("?")[0].split("/").filter(Boolean).map(function (seg) {
      try { return decodeURIComponent(seg); } catch (e) { return seg; }
    });
  }

  function render() {
    var app = document.getElementById("app");
    if (app.hidden) return;
    var route = currentRoute();
    document.querySelectorAll("#main-nav a").forEach(function (a) {
      a.classList.toggle("active", a.dataset.route === (route[0] || "home"));
    });

    if (!db) {
      document.getElementById("view").innerHTML = '<div class="panel empty-state">Connecting to storage… if this doesn’t clear in a few seconds, reload the page.</div>';
      return;
    }
    if (!isReady()) {
      document.getElementById("view").innerHTML = '<div class="panel empty-state">Loading inventory…</div>';
      return;
    }

    var view = document.getElementById("view");
    if (route[0] === "s" && route[1] && route[2] === "print") view.innerHTML = renderStagingPrint(route[1]);
    else if (route[0] === "s" && route[1]) view.innerHTML = renderStagingLocation(route[1]);
    else if (route[0] === "o" && route[1] && route[2] === "print") view.innerHTML = renderOrderPrint(route[1]);
    else if (route[0] === "o" && route[1]) view.innerHTML = renderOrder(route[1]);
    else if (route[0] === "orders") view.innerHTML = renderOrders();
    else if (route[0] === "l" && route[1] && route[2] === "print") view.innerHTML = renderLocationPrint(route[1]);
    else if (route[0] === "l" && route[1]) view.innerHTML = renderLocation(route[1]);
    else if (route[0] === "locations" && route[1] === "print") view.innerHTML = renderPrintLabels();
    else if (route[0] === "locations") view.innerHTML = renderLocations();
    else if (route[0] === "parts" && route[1]) view.innerHTML = renderPartDetail(route[1]);
    else if (route[0] === "parts") view.innerHTML = renderParts();
    else view.innerHTML = renderHome();

    renderQRCodes();
    renderBarcodes();
    document.querySelectorAll("input[data-photo]").forEach(wirePhotoInput);
    var autoFocusEl = view.querySelector("[data-autofocus]");
    if (autoFocusEl) autoFocusEl.focus();
  }

  var renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function () {
      renderQueued = false;
      render();
    });
  }

  function renderQRCodes() {
    document.querySelectorAll("[data-qr]").forEach(function (el) {
      var code = el.dataset.qr;
      var size = Number(el.dataset.qrSize || 120);
      el.innerHTML = "";
      try {
        if (typeof QRCode === "undefined") throw new Error("QRCode library not loaded");
        new QRCode(el, { text: locationUrl(code), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
      } catch (e) {
        el.innerHTML = '<a href="' + locationUrl(code) + '" style="font-family:var(--font-mono); font-size:0.75em; word-break:break-all;">' + locationUrl(code) + '</a>';
      }
    });
  }

  function renderBarcodes() {
    document.querySelectorAll("[data-barcode]").forEach(function (el) {
      var value = el.dataset.barcode;
      try {
        if (typeof JsBarcode === "undefined") throw new Error("JsBarcode library not loaded");
        JsBarcode(el, value, { format: "CODE128", displayValue: true, height: 56, margin: 0, fontSize: 16 });
      } catch (e) {
        el.outerHTML = '<span style="font-family:var(--font-mono); font-weight:700;">' + esc(value) + '</span>';
      }
    });
  }

  // ---------- view: staging location ----------
  function normalizeStagingCode(raw) {
    var m = /^(?:ST-?)?([A-Z0-9]{2})$/.exec(String(raw || "").trim().toUpperCase());
    return m ? "ST-" + m[1] : null;
  }
  function stagingHref(code) { return "#/s/" + encodeURIComponent(code); }

  function ordersStagedAt(code) {
    return state.orders
      .filter(function (o) { return o.status === "staging" && String(o.stagingLocation || "").toUpperCase() === code; })
      .sort(function (a, b) { return (a.updatedAt || 0) - (b.updatedAt || 0); });
  }
  function packageTotalsFor(orders) {
    var totals = { box: 0, bag: 0, other: 0 };
    orders.forEach(function (o) {
      PACKAGE_TYPES.forEach(function (t) { totals[t.key] += Number(o.packages && o.packages[t.key]) || 0; });
    });
    return totals;
  }

  function renderStagingLocation(rawCode) {
    var code = normalizeStagingCode(rawCode);
    if (!code) return '<p class="empty-state">That isn\u2019t a staging location. They look like ST-04.</p>';
    var here = ordersStagedAt(code);

    // Totals across everything staged here, by package type.
    var totals = packageTotalsFor(here);
    var totalPackages = PACKAGE_TYPES.reduce(function (n, t) { return n + totals[t.key]; }, 0);
    var breakdown = packagesLabel({ packages: totals });

    var html = '<div class="crumb"><a href="#/">Home</a> / Staging</div>' +
      '<div class="view-head" style="margin-bottom:4px;"><h1>' + esc(code) + '</h1></div>';

    if (!here.length) {
      html += '<p class="empty-state">Nothing is staged here.</p>';
    } else {
      html += '<div style="font-size:1.6em; font-weight:700; font-family:var(--font-mono);">' + totalPackages + ' package' + (totalPackages === 1 ? '' : 's') + '</div>' +
        (breakdown ? '<div class="hint" style="font-size:1em; margin-bottom:8px;">' + esc(breakdown) + '</div>' : '');
      html += '<div class="section-title">Orders</div>';
      html += here.map(function (o) {
        return '<a class="order-list-row" href="' + orderHref(o) + '">' +
          '<div style="min-width:0;"><span class="ledger-name">' + esc(o.orderNumber) + '</span>' +
            '<div class="hint">' + esc(o.customerName || "") + (packagesLabel(o) ? ' \u00b7 ' + esc(packagesLabel(o)) : '') + '</div></div>' +
          statusBadge(o.status) +
        '</a>';
      }).join("");
    }

    html += '<div class="panel no-print" style="margin-top:24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;">' +
      '<div class="barcode-box"><svg data-barcode="' + esc(code) + '"></svg></div>' +
      '<a class="btn btn-accent" href="' + stagingHref(code) + '/print">Print barcode</a>' +
    '</div>';
    if (here.length) {
      html += '<div class="no-print" style="display:flex; justify-content:flex-end; margin-top:14px;">' +
        '<button class="btn btn-accent" type="button" data-close-orders="' + esc(code) + '">Close Orders</button>' +
      '</div>';
    }
    return html;
  }

  function renderStagingPrint(rawCode) {
    var code = normalizeStagingCode(rawCode);

      '</select>' +

    } else {

          statusBadge(o.status) +

  // What to pick for one order line, with where it's currently stocked.
  function orderLineHtml(ln, order) {
    var part = getPart(ln.partId);
    var picked = ln.picked || 0;
    var remaining = ln.quantity - picked;
    var locs = part ? locationsForPart(part.id) : [];
    var onHand = locs.reduce(function (sum, r) { return sum + r.quantity; }, 0);
    var locHtml;
    if (!part) locHtml = '<div class="order-short">This part has been removed from the catalog.</div>';
    else if (!locs.length) locHtml = '<div class="order-short">Not stocked at any location.</div>';
    else {
      locHtml = '<div class="order-loc-list">' + locs.map(function (r) {
        return '<a class="order-loc" href="#/l/' + esc(r.location.code) + '">' + esc(r.location.name) + ' · ' + r.quantity + '</a>';

      (remaining > 0 && onHand < remaining ? '<div class="order-short">Only ' + onHand + ' on hand.</div>' : '');

  // ---------- cycle count ----------
  // Spot-checks a random in-stock location+part pair against what's actually on the shelf,
  // and corrects the recorded quantity to match. Only draws from rows with quantity > 0 —
  // that's the intended scope, not a bug: cycle counts verify what's supposed to be there.
  function pickCycleCountTarget(exclude) {
    var candidates = state.inventory.filter(function (i) {
      return i.quantity > 0 && getLocationById(i.locationId) && getPart(i.partId);
    });
    if (!candidates.length) return null;
    if (exclude && candidates.length > 1) {
      var narrowed = candidates.filter(function (i) {
        return !(i.locationId === exclude.locationId && i.partId === exclude.partId);
      });
      if (narrowed.length) candidates = narrowed;
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function startCycleCount() {
    var target = pickCycleCountTarget(cycleCount);
    if (!target) {
      toast("Nothing is currently stocked anywhere to count.", true);
      return;
    }
    cycleCount = { locationId: target.locationId, partId: target.partId };
    renderCycleModal();
  }

  function closeCycleModal() {
    cycleCount = null;
    document.getElementById("cycle-modal").hidden = true;
  }

  function applyCycleCount(locationId, partId, actualQty) {
    var invId = locationId + "__" + partId;
    var ref = db.doc("inventory/" + invId);
    return ref.get().then(function (snap) {
      var current = snap.exists ? (snap.data().quantity || 0) : 0;
      var next = Math.max(0, actualQty);
      return ref.set({ locationId: locationId, partId: partId, quantity: next, updatedAt: Date.now() }).then(function () {
        var reason = (next === current) ? ("cycle count: confirmed at " + next) : ("cycle count: " + current + " → " + next);
        logActivity(locationId, partId, next - current, reason);
        noteInventory(locationId, partId, next);
        if (next > current) fillBackorders();
        toast(next === current ? "Count matches — no change needed." : "Updated to " + next + ".");
        return true;
      });
    }).catch(function (e) {
      toast("Couldn't save that count: " + e.message, true);
      return false;
    });
  }

  function submitCycleCount(rawQty) {
    if (!cycleCount) return;
    if (rawQty === "" || rawQty == null) { toast("Enter a quantity of 0 or more.", true); return; }
    var qty = Math.round(Number(rawQty));
    if (isNaN(qty) || qty < 0) { toast("Enter a quantity of 0 or more.", true); return; }
    applyCycleCount(cycleCount.locationId, cycleCount.partId, qty).then(function (ok) {
      if (ok) closeCycleModal();
    });
  }
