<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Clean Inventory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f2f3ef;
    --surface: #ffffff;
    --surface-2: #eceee9;
    --ink: #1b1f1c;
    --muted: #5c655e;
    --faint: #8a9189;
    --line: #d8dcd4;
    --accent: #c9670f;
    --accent-ink: #ffffff;
    --accent-wash: #f5e2cd;
    --danger: #ab3427;
    --danger-wash: #f8e2de;
    --good: #3d7a44;
    --radius-sm: 4px;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(20, 24, 20, 0.06), 0 1px 1px rgba(20, 24, 20, 0.04);
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15170f;
      --surface: #1d201a;
      --surface-2: #262a21;
      --ink: #edeee7;
      --muted: #a3ab9c;
      --faint: #737a6d;
      --line: #343a2d;
      --accent: #ef9a3c;
      --accent-ink: #1b1400;
      --accent-wash: #3a2c14;
      --danger: #e08277;
      --danger-wash: #3a201c;
      --good: #7cbf7f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15170f;
    --surface: #1d201a;
    --surface-2: #262a21;
    --ink: #edeee7;
    --muted: #a3ab9c;
    --faint: #737a6d;
    --line: #343a2d;
    --accent: #ef9a3c;
    --accent-ink: #1b1400;
    --accent-wash: #3a2c14;
    --danger: #e08277;
    --danger-wash: #3a201c;
    --good: #7cbf7f;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-weight: 600; text-wrap: balance; margin: 0; }
  a { color: inherit; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  input, select, textarea {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.55em 0.7em;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button { cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4em;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 0.55em 0.9em; font-weight: 600; font-size: 0.92em;
    background: var(--surface-2); color: var(--ink); text-decoration: none;
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(1px); }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-ink { background: var(--ink); color: var(--bg); }
  .btn-ghost { background: transparent; border-color: var(--line); }
  .btn-danger { background: var(--danger-wash); color: var(--danger); }
  .btn-sm { padding: 0.35em 0.6em; font-size: 0.85em; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .label-eyebrow {
    font-family: var(--font-mono); font-size: 0.72em; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted);
  }
  .qty {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .qty-stencil {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.6em; padding: 0.25em 0.4em;
    border: 1.5px solid var(--ink); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-weight: 700; font-size: 1.05em;
    font-variant-numeric: tabular-nums;
  }
  .qty-zero { color: var(--faint); border-color: var(--line); }

  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(45deg, var(--surface-2) 0, var(--surface-2) 1px, transparent 1px, transparent 14px);
  }
  .gate-card {
    width: 100%; max-width: 340px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 26px;
  }
  .gate-mark {
    font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.02em;
    font-size: 1.3em; display: flex; align-items: center; gap: 0.4em; margin-bottom: 4px;
  }
  .gate-mark .dot { width: 0.55em; height: 0.55em; border-radius: 2px; background: var(--accent); display: inline-block; }
  .gate-sub { color: var(--muted); font-size: 0.9em; margin: 0 0 20px; }
  .gate-error { color: var(--danger); font-size: 0.85em; margin-top: 10px; min-height: 1.2em; }

  header.app-header {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto; padding: 0 18px;
    height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .wordmark {
    font-family: var(--font-mono); font-weight: 700; font-size: 1.02em;
    display: flex; align-items: center; gap: 0.45em; text-decoration: none; white-space: nowrap;
  }
  .wordmark .dot { width: 0.5em; height: 0.5em; border-radius: 2px; background: var(--accent); display: inline-block; }
  nav.main-nav { display: flex; gap: 4px; align-items: center; }
  nav.main-nav a, nav.main-nav button {
    font-size: 0.88em; padding: 0.5em 0.7em; border-radius: var(--radius-sm);
    text-decoration: none; color: var(--muted); background: none; border: none; font-weight: 600;
  }
  nav.main-nav a.active, nav.main-nav a:hover, nav.main-nav button:hover { color: var(--ink); background: var(--surface-2); }

  main.app-main { max-width: 900px; margin: 0 auto; padding: 28px 18px 80px; }
  .view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .crumb { color: var(--muted); font-size: 0.85em; margin-bottom: 6px; }
  .crumb a:hover { color: var(--ink); text-decoration: underline; }
  .section-title {
    font-family: var(--font-mono); font-size: 0.75em; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 28px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px;
  }
  .form-grid { display: grid; gap: 10px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-row > * { flex: 1; min-width: 140px; }

  .loc-parts-row { display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap; }
  .loc-part-field { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .loc-part-label {
    font-family: var(--font-mono); font-size: 0.7em; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); text-align: center;
  }
  .loc-part-input {
    width: 3.4em; text-align: center; text-transform: uppercase;
    font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.04em;
  }
  .loc-part-sep { color: var(--faint); font-weight: 700; padding-bottom: 0.6em; }
  .hint { color: var(--faint); font-size: 0.82em; }
  .msg-banner {
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.9em; margin-bottom: 16px;
    background: var(--danger-wash); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
  }

  .ledger { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .ledger-row {
    display: flex; gap: 14px; align-items: center; padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .ledger-row:first-child { border-top: 1px solid var(--line); }
  .thumb {
    width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .thumb-empty {
    width: 48px; height: 48px; border-radius: var(--radius-sm); flex-shrink: 0;
    border: 1px dashed var(--line); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 1.3em;
  }
  .ledger-main { flex: 1; min-width: 0; }
  .ledger-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .ledger-name { font-weight: 600; text-decoration: none; }
  .ledger-name:hover { text-decoration: underline; }
  .ledger-sku { color: var(--faint); font-family: var(--font-mono); font-size: 0.78em; }
  .ledger-actions { display: flex; gap: 6px; margin-top: 8px; }
  .qty-input { width: 3.6em; padding: 0.35em 0.5em; text-align: center; font-family: var(--font-mono); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .loc-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    text-decoration: none;
  }
  .loc-card:hover { border-color: var(--accent); }
  .qr-box { background: #fff; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--line); }
  .loc-name { font-weight: 600; }
  .loc-notes { color: var(--muted); font-size: 0.85em; }

  .part-card {
    display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; text-decoration: none;
  }
  .part-card:hover { border-color: var(--accent); }
  .part-total { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }

  .empty-state { color: var(--muted); font-size: 0.92em; padding: 18px 4px; }

  .toast-wrap { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--radius-sm);
    font-size: 0.88em; box-shadow: var(--shadow); animation: toast-in 0.15s ease-out;
  }
  .toast.err { background: var(--danger); color: #fff; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }

  .activity-list { list-style: none; margin: 0; padding: 0; }
  .activity-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 0.87em; }
  .activity-row:last-child { border-bottom: none; }
  .activity-delta { font-family: var(--font-mono); font-weight: 700; }
  .activity-delta.pos { color: var(--good); }
  .activity-delta.neg { color: var(--danger); }

  .photo-input-row { display: flex; align-items: center; gap: 10px; }
  .photo-preview { width: 44px; height: 44px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--line); display: none; }

  [hidden] { display: none !important; }

  .scan-fab-wrap {
    position: fixed; left: 0; right: 0; bottom: 84px; z-index: 40;
    display: flex; justify-content: center; pointer-events: none;
  }
  .scan-fab {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 0.5em;
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 999px; padding: 0.7em 1.1em 0.7em 0.9em;
    font-weight: 600; font-size: 1.35em; box-shadow: var(--shadow);
  }
  .scan-fab:hover { filter: brightness(1.1); }
  .scan-fab svg { width: 1.2em; height: 1.2em; flex-shrink: 0; }

  .scan-modal-backdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(10, 12, 8, 0.6);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .scan-modal {
    width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  }
  .scan-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .scan-video-wrap {
    position: relative; border-radius: var(--radius-sm); overflow: hidden;
    background: #000; aspect-ratio: 1 / 1;
  }
  .scan-video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-reticle {
    position: absolute; inset: 14%; border: 2px solid rgba(255,255,255,0.75); border-radius: 12px;
    box-shadow: 0 0 0 999px rgba(0,0,0,0.25);
  }
  .scan-status { margin: 12px 0 0; font-size: 0.85em; color: var(--muted); min-height: 1.3em; }
  .scan-manual { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-top: 12px; }
  .scan-manual > input { flex: 1; }
  .flow-error { color: var(--danger); font-size: 0.85em; min-height: 1.2em; margin: 0; }

  @media print {
    header.app-header, .no-print { display: none !important; }
    body { background: #fff; }
    main.app-main { padding: 0; max-width: none; }
    .print-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .print-tile { break-inside: avoid; text-align: center; border: 1px dashed #999; padding: 14px; }
  }
</style>

<div id="gate">
  <div class="gate-card">
    <div class="gate-mark"><span class="dot"></span>Clean Inventory</div>
    <p class="gate-sub">Enter the shared passcode to open the shop inventory.</p>
    <form id="gate-form" class="form-grid">
      <input id="gate-input" type="password" placeholder="Passcode" autocomplete="off" autofocus required />
      <button type="submit" class="btn btn-accent">Unlock</button>
      <div class="gate-error" id="gate-error"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="app-header">
    <div class="header-inner">
      <a href="#/" class="wordmark"><span class="dot"></span>Clean Inventory</a>
      <nav class="main-nav" id="main-nav">
        <a href="#/parts" data-route="parts">Parts</a>
        <a href="#/locations" data-route="locations">Setup</a>
      </nav>
    </div>
  </header>
  <main class="app-main" id="view"></main>

  <div class="scan-fab-wrap">
    <button class="scan-fab" id="scan-fab" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        <rect x="7" y="7" width="10" height="10" rx="1"/>
      </svg>
      Scan location
    </button>
  </div>

  <div class="scan-modal-backdrop" id="cycle-modal" hidden>
    <div class="scan-modal">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;">Cycle count</h2>
        <button class="btn btn-ghost btn-sm" id="cycle-close" type="button">Close</button>
      </div>
      <div id="cycle-body"></div>
    </div>
  </div>

  <div class="scan-modal-backdrop" id="flow-modal" hidden>
    <div class="scan-modal">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;" id="flow-title"></h2>
        <button class="btn btn-ghost btn-sm" id="flow-close" type="button">Close</button>
      </div>
      <div id="flow-body"></div>
    </div>
  </div>

  <div class="scan-modal-backdrop" id="scan-modal" hidden>
    <div class="scan-modal">
      <div class="scan-modal-head">
        <h2 style="font-size:1em;">Scan a location's QR code</h2>
        <button class="btn btn-ghost btn-sm" id="scan-close" type="button">Close</button>
      </div>
      <div class="scan-video-wrap">
        <video id="scan-video" playsinline autoplay muted></video>
        <div class="scan-reticle"></div>
      </div>
      <p class="scan-status" id="scan-status">Requesting camera access…</p>
      <form class="scan-manual" id="scan-manual-form">
        <div class="loc-parts-row">
          <label class="loc-part-field"><span class="loc-part-label">Section</span><input type="text" id="scan-manual-section" class="loc-part-input" maxlength="1" placeholder="X" autocomplete="off" /></label>
          <span class="loc-part-sep">–</span>
          <label class="loc-part-field"><span class="loc-part-label">Aisle</span><input type="text" id="scan-manual-aisle" class="loc-part-input" maxlength="2" placeholder="XX" autocomplete="off" /></label>
          <span class="loc-part-sep">–</span>
          <label class="loc-part-field"><span class="loc-part-label">Bay</span><input type="text" id="scan-manual-bay" class="loc-part-input" maxlength="2" placeholder="XX" autocomplete="off" /></label>
          <span class="loc-part-sep">–</span>
          <label class="loc-part-field"><span class="loc-part-label">Shelf</span><input type="text" id="scan-manual-shelf" class="loc-part-input" maxlength="2" placeholder="XX" autocomplete="off" /></label>
        </div>
        <button class="btn btn-accent btn-sm" type="submit">Go</button>
      </form>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
(function () {
  "use strict";

  // ---------- app state (must be assigned before anything can call boot()/render(), including
  // the immediate "already unlocked" check below) ----------
  var db = null;
  var state = {
    locations: [],
    parts: [],
    inventory: [],
    ready: { locations: false, parts: false, inventory: false }
  };

  // ---------- Supabase config (same reasoning — must precede the early unlock check) ----------
  var SUPABASE_URL = "https://iyumqmcwuosajgnhqyhy.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_bN2qxXdk7vT3po8KwSIL2w_pp3GM5PA";

  var SUPABASE_FIELDS = {
    locations: { code: "code", name: "name", section: "section", aisle: "aisle", bay: "bay", shelf: "shelf", notes: "notes", createdAt: "created_at", recentActivity: "recent_activity" },
    parts: { name: "name", sku: "sku", description: "description", photoDataUrl: "photo_data_url", createdAt: "created_at", recentActivity: "recent_activity" },
    inventory: { locationId: "location_id", partId: "part_id", quantity: "quantity", updatedAt: "updated_at" }
  };

  // ---------- passcode gate ----------
  var PASSCODE_HASH = "efa3a6980f12158bcb1d88e68552174acf74807034c4ffe886826d310d8a654d"; // sha256("shiny0830")
  var UNLOCK_KEY = "ci_unlocked_v1";

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    });
  }

  function showApp() {
    document.getElementById("gate").hidden = true;
    var app = document.getElementById("app");
    app.hidden = false;
    boot();
  }

  document.getElementById("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var val = document.getElementById("gate-input").value;
    sha256Hex(val).then(function (hash) {
      if (hash === PASSCODE_HASH) {
        try { localStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {}
        showApp();
      } else {
        document.getElementById("gate-error").textContent = "That passcode isn't right. Try again.";
      }
    });
  });

  // Passcode gate temporarily disabled - security approach will change later.
  // (Gate markup/logic above is left in place so it is easy to re-enable.)
  showApp();

  function isReady() { return state.ready.locations && state.ready.parts && state.ready.inventory; }

  function toast(msg, isErr) {
    var wrap = document.getElementById("toasts");
    var el = document.createElement("div");
    el.className = "toast" + (isErr ? " err" : "");
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function genCode(len) {
    var chars = "abcdefghjkmnpqrstuvwxyz23456789";
    var s = "";
    for (var i = 0; i < (len || 6); i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function locationUrl(code) {
    var url = new URL(window.location.href);
    url.hash = "#/l/" + code;
    return url.toString();
  }

  // ---------- data helpers ----------
  function getLocationByCode(code) {
    return state.locations.find(function (l) { return l.code === code; });
  }
  function getLocationById(id) {
    return state.locations.find(function (l) { return l.id === id; });
  }
  function getPart(id) {
    return state.parts.find(function (p) { return p.id === id; });
  }
  function invRow(locationId, partId) {
    return state.inventory.find(function (i) { return i.locationId === locationId && i.partId === partId; });
  }
  function inventoryForLocation(locationId) {
    return state.inventory
      .filter(function (i) { return i.locationId === locationId && i.quantity > 0; })
      .map(function (i) { return Object.assign({}, i, { part: getPart(i.partId) }); })
      .filter(function (r) { return r.part; })
      .sort(function (a, b) { return a.part.name.localeCompare(b.part.name); });
  }
  function locationsForPart(partId) {
    return state.inventory
      .filter(function (i) { return i.partId === partId && i.quantity > 0; })
      .map(function (i) { return { location: state.locations.find(function (l) { return l.id === i.locationId; }), quantity: i.quantity }; })
      .filter(function (r) { return r.location; })
      .sort(function (a, b) { return a.location.name.localeCompare(b.location.name); });
  }
  function totalForPart(partId) {
    return state.inventory.filter(function (i) { return i.partId === partId; }).reduce(function (s, i) { return s + i.quantity; }, 0);
  }

  // ---------- mutations ----------
  function applyChange(locationId, partId, delta, reason) {
    var invId = locationId + "__" + partId;
    var ref = db.doc("inventory/" + invId);
    return ref.get().then(function (snap) {
      var current = snap.exists ? (snap.data().quantity || 0) : 0;
      var next = current + delta;
      if (next < 0) {
        toast("Only " + current + " in stock — can't pull " + Math.abs(delta) + ".", true);
        return false;
      }
      return ref.set({ locationId: locationId, partId: partId, quantity: next, updatedAt: Date.now() }).then(function () {
        logActivity(locationId, partId, delta, reason);
        return true;
      });
    }).catch(function (e) {
      toast("Couldn't save that change: " + e.message, true);
      return false;
    });
  }

  function logActivity(locationId, partId, delta, reason) {
    var loc = state.locations.find(function (l) { return l.id === locationId; });
    var part = getPart(partId);
    var locRef = db.doc("locations/" + locationId);
    var partRef = db.doc("parts/" + partId);
    locRef.get().then(function (snap) {
      var arr = (snap.exists && snap.data().recentActivity) || [];
      arr = [{ ts: Date.now(), delta: delta, reason: reason, otherName: part ? part.name : "Part" }].concat(arr).slice(0, 15);
      return locRef.update({ recentActivity: arr });
    }).catch(function () {});
    partRef.get().then(function (snap) {
      var arr = (snap.exists && snap.data().recentActivity) || [];
      arr = [{ ts: Date.now(), delta: delta, reason: reason, otherName: loc ? loc.name : "Location" }].concat(arr).slice(0, 15);
      return partRef.update({ recentActivity: arr });
    }).catch(function () {});
  }

  function locationLabel(section, aisle, bay, shelf) {
    return [section, aisle, bay, shelf].map(function (s) { return String(s || "").toUpperCase(); }).join("-");
  }

  function createLocation(section, aisle, bay, shelf, notes) {
    var name = locationLabel(section, aisle, bay, shelf);
    return db.collection("locations").add({
      code: genCode(6), name: name,

    }).then(function () { toast("Location created."); }).catch(function (e) { toast(e.message, true); });

  function deleteLocation(locationId) {
    var loc = getLocationById(locationId);

  // ---------- photo compression ----------
  function compressImage(file) {
    var attempts = [[480, 0.6], [360, 0.5], [260, 0.45]];
    function tryOne(i) {
      var maxDim = attempts[i][0], quality = attempts[i][1];
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var w = img.width, h = img.height;
            if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
            else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
            var canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      }).then(function (dataUrl) {
        if (dataUrl.length > 170000 && i < attempts.length - 1) return tryOne(i + 1);
        if (dataUrl.length > 170000) throw new Error("too big");
        return dataUrl;
      });
    }
    return tryOne(0);
  }

  function wirePhotoInput(input) {
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      var preview = input.parentElement.querySelector(".photo-preview");
      if (!file) return;
      input.disabled = true;
      compressImage(file).then(function (dataUrl) {
        input.dataset.compressed = dataUrl;
        if (preview) { preview.src = dataUrl; preview.style.display = "inline-block"; }
      }).catch(function () {
        toast("That photo is too large — try a smaller or simpler photo.", true);
        input.value = "";
      }).finally(function () { input.disabled = false; });
    });
  }

  // ---------- routing ----------
  function currentRoute() {
    var h = window.location.hash.replace(/^#\/?/, "");
    return h.split("/").filter(Boolean);

  function render() {
    var app = document.getElementById("app");
    if (app.hidden) return;
    var route = currentRoute();
    document.querySelectorAll("#main-nav a").forEach(function (a) {
      a.classList.toggle("active", a.dataset.route === (route[0] || "parts"));
    });

    if (!db) {
      document.getElementById("view").innerHTML = '<div class="panel empty-state">Connecting to storage… if this doesn’t clear in a few seconds, reload the page.</div>';
      return;
    }
    if (!isReady()) {
      document.getElementById("view").innerHTML = '<div class="panel empty-state">Loading inventory…</div>';
      return;
    }

    var view = document.getElementById("view");
    if (route[0] === "l" && route[1] && route[2] === "print") view.innerHTML = renderLocationPrint(route[1]);
    else if (route[0] === "l" && route[1]) view.innerHTML = renderLocation(route[1]);
    else if (route[0] === "locations" && route[1] === "print") view.innerHTML = renderPrintLabels();
    else if (route[0] === "locations") view.innerHTML = renderLocations();
    else if (route[0] === "parts" && route[1]) view.innerHTML = renderPartDetail(route[1]);
    else if (route[0] === "parts") view.innerHTML = renderParts();
    else view.innerHTML = renderParts();

    renderQRCodes();
    document.querySelectorAll("input[data-photo]").forEach(wirePhotoInput);
    var autoFocusEl = view.querySelector("[data-autofocus]");
    if (autoFocusEl) autoFocusEl.focus();
  }

  function renderQRCodes() {

      try {

        new QRCode(el, { text: locationUrl(code), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
      } catch (e) {
        el.innerHTML = '<a href="' + locationUrl(code) + '" style="font-family:var(--font-mono); font-size:0.75em; word-break:break-all;">' + locationUrl(code) + '</a>';

  // ---------- cycle count ----------
  // Spot-checks a random in-stock location+part pair against what's actually on the shelf,
  // and corrects the recorded quantity to match. Only draws from rows with quantity > 0 —
  // that's the intended scope, not a bug: cycle counts verify what's supposed to be there.
  function pickCycleCountTarget(exclude) {
    var candidates = state.inventory.filter(function (i) {
      return i.quantity > 0 && getLocationById(i.locationId) && getPart(i.partId);
    });
    if (!candidates.length) return null;
    if (exclude && candidates.length > 1) {
      var narrowed = candidates.filter(function (i) {
        return !(i.locationId === exclude.locationId && i.partId === exclude.partId);
      });
      if (narrowed.length) candidates = narrowed;
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function startCycleCount() {
    var target = pickCycleCountTarget(cycleCount);
    if (!target) {
      toast("Nothing is currently stocked anywhere to count.", true);
      return;
    }
    cycleCount = { locationId: target.locationId, partId: target.partId };
    renderCycleModal();
  }

  function closeCycleModal() {
    cycleCount = null;
    document.getElementById("cycle-modal").hidden = true;
  }

  function applyCycleCount(locationId, partId, actualQty) {
    var invId = locationId + "__" + partId;
    var ref = db.doc("inventory/" + invId);
    return ref.get().then(function (snap) {
      var current = snap.exists ? (snap.data().quantity || 0) : 0;
      var next = Math.max(0, actualQty);
      return ref.set({ locationId: locationId, partId: partId, quantity: next, updatedAt: Date.now() }).then(function () {
        var reason = (next === current) ? ("cycle count: confirmed at " + next) : ("cycle count: " + current + " → " + next);
        logActivity(locationId, partId, next - current, reason);
        toast(next === current ? "Count matches — no change needed." : "Updated to " + next + ".");
        return true;
      });
    }).catch(function (e) {
      toast("Couldn't save that count: " + e.message, true);
      return false;
    });
  }

  function submitCycleCount(rawQty) {
    if (!cycleCount) return;
    if (rawQty === "" || rawQty == null) { toast("Enter a quantity of 0 or more.", true); return; }
    var qty = Math.round(Number(rawQty));
    if (isNaN(qty) || qty < 0) { toast("Enter a quantity of 0 or more.", true); return; }
    applyCycleCount(cycleCount.locationId, cycleCount.partId, qty).then(function (ok) {
      if (ok) closeCycleModal();
    });
  }

  function renderCycleCountBox() {
    return '<div class="panel" style="margin-bottom:22px;">' +
      '<div class="section-title" style="margin-top:0;">Cycle count</div>' +
      '<button class="btn btn-accent" type="button" id="cycle-start">Start a cycle count</button>' +
    '</div>';
  }

  function renderCycleModal() {
    var modal = document.getElementById("cycle-modal");
    if (!cycleCount) { modal.hidden = true; return; }
    var loc = getLocationById(cycleCount.locationId);
    var part = getPart(cycleCount.partId);
    modal.hidden = false;
    if (!loc || !part) {
      document.getElementById("cycle-body").innerHTML = '<p class="hint">That location or part is no longer available.</p>';
      return;
    }
    document.getElementById("cycle-body").innerHTML =
      '<p style="margin:0 0 12px;">Run cycle count of <strong>' + esc(part.name) + '</strong> at <strong>' + esc(loc.name) + '</strong>.</p>' +
      '<div class="form-row">' +
        '<input type="number" id="cycle-qty-input" min="0" placeholder="Actual Quantity" />' +
        '<button class="btn btn-accent" type="button" id="cycle-submit" style="flex:0 0 auto;">Save count</button>' +
      '</div>' +
      '<button class="btn btn-accent btn-sm" type="button" id="cycle-skip" style="margin-top:10px;">Skip</button>';

  }

  function wireCycleModal() {
    var submitBtn = document.getElementById("cycle-submit");
    if (submitBtn) submitBtn.addEventListener("click", function () {
      var input = document.getElementById("cycle-qty-input");
      submitCycleCount(input ? input.value : "");
    });
    var skipBtn = document.getElementById("cycle-skip");
    if (skipBtn) skipBtn.addEventListener("click", startCycleCount);
  }

  function renderPartDetail(id) {
    var part = getPart(id);
    if (!part) return '<p class="empty-state">Part not found.</p>';
    var locs = locationsForPart(id);
    var total = locs.reduce(function (s, l) { return s + l.quantity; }, 0);
    var activity = part.recentActivity || [];

    var html = '<div class="crumb"><a href="#/parts">Parts</a> / ' + esc(part.name) + '</div>';
    html += '<div class="panel" style="display:flex; gap:16px;">' +
      (part.photoDataUrl ? '<img src="' + part.photoDataUrl + '" alt="" style="width:88px;height:88px;object-fit:cover;border-radius:6px;border:1px solid var(--line);" />' : '<div class="thumb-empty" style="width:88px;height:88px;">—</div>') +
      '<div style="flex:1;">' +
        '<h1>' + esc(part.name) + '</h1>' +
        (part.sku ? '<div class="ledger-sku">SKU ' + esc(part.sku) + '</div>' : '') +
        (part.description ? '<p style="margin:8px 0 0; color:var(--muted);">' + esc(part.description) + '</p>' : '') +
        '<div style="margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">' +
          '<p class="qty" style="margin:0;">' + total + ' total in stock</p>' +
          (total > 0
            ? '<div style="display:flex; gap:6px; align-items:center;">' +
                '<input class="qty-input" type="number" id="pull-qty-input" min="1" value="1" />' +
                '<button class="btn btn-accent btn-sm" type="button" data-pull="' + id + '">Pull</button>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>' +
    '</div>';

    html += '<div class="section-title">Where it is</div>';
    html += locs.length
      ? '<ul class="ledger">' + locs.map(function (r) {
          return '<li class="ledger-row"><a class="ledger-name" href="#/l/' + esc(r.location.code) + '" style="flex:1;">' + esc(r.location.name) + '</a><span class="qty-stencil">' + r.quantity + '</span></li>';
        }).join("") + '</ul>'
      : '<p class="empty-state">Not currently stocked anywhere.</p>';

    html += '<div class="form-row" style="margin-top:10px;">' +
      '<button class="btn btn-accent" type="button" data-flow="add" data-part="' + id + '" style="flex:0 0 auto;">Add to location</button>' +
      (locs.length ? '<button class="btn btn-accent" type="button" data-flow="move" data-part="' + id + '" style="flex:0 0 auto;">Move</button>' : '') +
    '</div>';

    if (activity.length) {
      html += '<div class="section-title">Recent activity</div>';
      html += '<ul class="activity-list panel">' + activity.map(function (a) {
        return '<li class="activity-row"><span>' + new Date(a.ts).toLocaleString() + ' · ' + esc(a.otherName) + ' · ' + esc(a.reason) + '</span>' +
          '<span class="activity-delta ' + (a.delta >= 0 ? "pos" : "neg") + '">' + (a.delta >= 0 ? "+" : "") + a.delta + '</span></li>';
      }).join("") + '</ul>';
    }

    html += '<div class="section-title">Edit part</div>';
    html += '<form class="panel form-grid" data-form="updatePart" data-id="' + part.id + '">' +
      '<div class="form-row">' +
        '<input type="text" name="name" value="' + esc(part.name) + '" required />' +
        '<input type="text" name="sku" value="' + esc(part.sku || "") + '" placeholder="SKU / part number" />' +
      '</div>' +
      '<textarea name="description" rows="2" placeholder="Description">' + esc(part.description || "") + '</textarea>' +
      '<div class="photo-input-row"><input type="file" accept="image/*" capture="environment" data-photo /><img class="photo-preview" alt="" /></div>' +
      '<button class="btn btn-accent" type="submit" style="justify-self:start;">Save changes</button>' +
    '</form>';
    return html;
  }

  // ---------- QR scanning ----------
  // scanner.onResolve, when set, redirects a successful scan/manual-entry to a callback
  // (used by the add/move/pull flows to choose a location) instead of navigating to it.
  var scanner = { stream: null, rafId: null, active: false, canvas: document.createElement("canvas"), onResolve: null };

  function extractLocationCode(text) {
    if (!text) return null;
    var s = String(text).trim();
    var m = s.match(/#\/l\/([a-z0-9]+)/i);
    if (m) return m[1];
    if (/^[a-z0-9]{3,16}$/i.test(s)) return s;
    return null;
  }

  function useLocation(loc) {
    var onResolve = scanner.onResolve;
    closeScanner();
    if (onResolve) {
      onResolve(loc);
    } else {
      window.location.hash = "#/l/" + loc.code;
      toast("Opened " + loc.name + ".");
    }
  }

  function goToScannedCode(raw) {
    var code = extractLocationCode(raw);
    if (!code) {
      document.getElementById("scan-status").textContent = "That doesn't look like a Clean Inventory location code.";
      return false;
    }
    var loc = getLocationByCode(code);
    if (!loc) {
      document.getElementById("scan-status").textContent = "No location matches that code.";
      return false;
    }
    useLocation(loc);
    return true;
  }

  function scanTick() {
    if (!scanner.active) return;
    if (typeof jsQR === "undefined") {
      document.getElementById("scan-status").textContent =
        "The QR scanning library didn't load — enter the location's Section-Aisle-Bay-Shelf below instead.";
      return;
    }
    var video = document.getElementById("scan-video");
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      var canvas = scanner.canvas;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var frame;
      try {
        frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        scanner.frameErrors = 0;
      } catch (e) {
        frame = null;
        scanner.frameErrors = (scanner.frameErrors || 0) + 1;
        if (scanner.frameErrors === 20) {
          document.getElementById("scan-status").textContent =
            "Couldn't read the camera image in this browser — enter the location's Section-Aisle-Bay-Shelf below instead.";
        }
      }
      if (frame) {
        var code = jsQR(frame.data, frame.width, frame.height, { inversionAttempts: "dontInvert" });
        if (code && code.data) {
          if (goToScannedCode(code.data)) return;
        }
      }
    }
    scanner.rafId = requestAnimationFrame(scanTick);
  }

  function openScanner(onResolve) {
    scanner.onResolve = onResolve || null;
    scanner.frameErrors = 0;
    var modal = document.getElementById("scan-modal");
    var status = document.getElementById("scan-status");
    modal.hidden = false;
    status.textContent = "Requesting camera access…";
    ["scan-manual-section", "scan-manual-aisle", "scan-manual-bay", "scan-manual-shelf"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = "";
    });

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.textContent = "Camera access isn't available here — type the location code below instead.";
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function (stream) {
      scanner.stream = stream;
      var video = document.getElementById("scan-video");
      video.srcObject = stream;
      video.play().catch(function () {});
      scanner.active = true;
      status.textContent = "Point the camera at a location's QR code.";
      scanner.rafId = requestAnimationFrame(scanTick);
    }).catch(function (e) {
      status.textContent = "Couldn't access the camera (" + e.message + ") — type the location code below instead.";
    });
  }

  function closeScanner() {
    scanner.active = false;
    if (scanner.rafId) cancelAnimationFrame(scanner.rafId);
    scanner.rafId = null;
    if (scanner.stream) {
      scanner.stream.getTracks().forEach(function (t) { t.stop(); });
      scanner.stream = null;
    }
    var video = document.getElementById("scan-video");
    if (video) video.srcObject = null;
    document.getElementById("scan-modal").hidden = true;
    scanner.onResolve = null;
  }

  document.getElementById("scan-fab").addEventListener("click", function () { openScanner(); });
  document.getElementById("scan-close").addEventListener("click", closeScanner);
  document.getElementById("scan-modal").addEventListener("click", function (e) {
    if (e.target.id === "scan-modal") closeScanner();
  });
  document.getElementById("scan-manual-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var loc = getLocationByParts(
      document.getElementById("scan-manual-section").value,
      document.getElementById("scan-manual-aisle").value,
      document.getElementById("scan-manual-bay").value,
      document.getElementById("scan-manual-shelf").value
    );
    if (!loc) {
      document.getElementById("scan-status").textContent = "No location matches that Section-Aisle-Bay-Shelf.";
      return;
    }
    useLocation(loc);
  });

  // ---------- add / move / pull flows ----------
  // A part can be stocked at any number of locations at once (inventory rows are keyed by
  // location+part, so the same part having stock in several places is the normal case, not
  // an edge case). These three flows let you add a part to a location, move stock from one
  // location to another, or pull (remove) stock — each via a popup where the location is
  // entered as Section-Aisle-Bay-Shelf (the same four auto-advancing boxes as "Add a
  // location") or resolved by scanning its QR label.
  var flow = null; // { kind: "add" | "move" | "pull", partId, section, aisle, bay, shelf, fromId, qty }
  var cycleCount = null; // { locationId, partId } — the current in-progress cycle count pick, or null

  function getLocationByParts(section, aisle, bay, shelf) {
    var s = (section || "").trim().toUpperCase();
    var a = (aisle || "").trim().toUpperCase();
    var b = (bay || "").trim().toUpperCase();
    var sh = (shelf || "").trim().toUpperCase();
    if (!s || !a || !b || !sh) return null;
    return state.locations.find(function (l) {
      return String(l.section || "").toUpperCase() === s &&
        String(l.aisle || "").toUpperCase() === a &&
        String(l.bay || "").toUpperCase() === b &&
        String(l.shelf || "").toUpperCase() === sh;
    }) || null;
  }

  function flowError(msg) {
    var el = document.getElementById("flow-error");
    if (el) el.textContent = msg || "";
  }

  function closeFlow() {
    flow = null;
    document.getElementById("flow-modal").hidden = true;
  }

  function openAddFlow(partId) {
    flow = { kind: "add", partId: partId, section: "", aisle: "", bay: "", shelf: "", qty: 1 };
    renderFlow();
  }

  function openMoveFlow(partId) {
    var locs = locationsForPart(partId);
    if (!locs.length) { toast("Not currently stocked anywhere to move from.", true); return; }
    flow = { kind: "move", partId: partId, fromId: locs[0].location.id, section: "", aisle: "", bay: "", shelf: "", qty: locs[0].quantity };
    renderFlow();
  }

  function openPullFlow(partId, qty) {
    var locs = locationsForPart(partId);
    if (!locs.length) { toast("Not currently stocked anywhere to pull from.", true); return; }
    flow = { kind: "pull", partId: partId, fromId: locs[0].location.id, qty: qty || 1 };
    renderFlow();
  }

  function renderFlow() {
    var modal = document.getElementById("flow-modal");
    if (!flow) { modal.hidden = true; return; }
    var part = getPart(flow.partId);
    modal.hidden = false;
    document.getElementById("flow-title").textContent =
      (flow.kind === "add" ? "Add " : flow.kind === "move" ? "Move " : "Pull ") + (part ? part.name : "this part");

    var locationBoxes =
      '<div class="loc-parts-row">' +
        '<label class="loc-part-field"><span class="loc-part-label">Section</span><input type="text" id="flow-section" class="loc-part-input" maxlength="1" placeholder="X" value="' + esc(flow.section || "") + '" /></label>' +
        '<span class="loc-part-sep">–</span>' +
        '<label class="loc-part-field"><span class="loc-part-label">Aisle</span><input type="text" id="flow-aisle" class="loc-part-input" maxlength="2" placeholder="XX" value="' + esc(flow.aisle || "") + '" /></label>' +
        '<span class="loc-part-sep">–</span>' +
        '<label class="loc-part-field"><span class="loc-part-label">Bay</span><input type="text" id="flow-bay" class="loc-part-input" maxlength="2" placeholder="XX" value="' + esc(flow.bay || "") + '" /></label>' +
        '<span class="loc-part-sep">–</span>' +
        '<label class="loc-part-field"><span class="loc-part-label">Shelf</span><input type="text" id="flow-shelf" class="loc-part-input" maxlength="2" placeholder="XX" value="' + esc(flow.shelf || "") + '" /></label>' +
        '<button class="btn btn-ghost btn-sm" type="button" id="flow-scan" style="margin-left:4px;">Scan</button>' +
      '</div>';

    if (flow.kind === "add") {
      document.getElementById("flow-body").innerHTML =
        '<div class="form-grid">' +
          '<label class="hint">Location</label>' + locationBoxes +
          '<label class="hint">Quantity</label>' +
          '<input type="number" id="flow-qty" min="1" value="' + flow.qty + '" />' +
          '<p class="flow-error" id="flow-error"></p>' +
          '<button class="btn btn-accent" type="button" id="flow-confirm">Add</button>' +
        '</div>';
    } else if (flow.kind === "move" || flow.kind === "pull") {
      var locs = locationsForPart(flow.partId);
      var fromSelect =
        '<select id="flow-from">' +
          locs.map(function (r) {
            return '<option value="' + r.location.id + '"' + (r.location.id === flow.fromId ? " selected" : "") + '>' +
              esc(r.location.name) + ' — ' + r.quantity + ' in stock</option>';
          }).join("") +
        '</select>';
      document.getElementById("flow-body").innerHTML =
        '<div class="form-grid">' +
          '<label class="hint">From</label>' + fromSelect +
          (flow.kind === "move" ? '<label class="hint">To</label>' + locationBoxes : "") +
          '<label class="hint">Quantity</label>' +
          '<input type="number" id="flow-qty" min="1" value="' + flow.qty + '" />' +
          '<p class="flow-error" id="flow-error"></p>' +
          '<button class="btn ' + (flow.kind === "move" ? "btn-accent" : "btn-accent") + '" type="button" id="flow-confirm">' +
            (flow.kind === "move" ? "Move" : "Pull") +
          '</button>' +
        '</div>';
    }

    wireFlow();
  }

  function wireFlow() {
    var sectionInput = document.getElementById("flow-section");
    if (sectionInput) sectionInput.addEventListener("input", function () { flow.section = sectionInput.value; });
    var aisleInput = document.getElementById("flow-aisle");
    if (aisleInput) aisleInput.addEventListener("input", function () { flow.aisle = aisleInput.value; });
    var bayInput = document.getElementById("flow-bay");
    if (bayInput) bayInput.addEventListener("input", function () { flow.bay = bayInput.value; });
    var shelfInput = document.getElementById("flow-shelf");
    if (shelfInput) shelfInput.addEventListener("input", function () { flow.shelf = shelfInput.value; });

    var fromSelect = document.getElementById("flow-from");
    if (fromSelect) fromSelect.addEventListener("change", function () { flow.fromId = fromSelect.value; });

    var qtyInput = document.getElementById("flow-qty");
    if (qtyInput) qtyInput.addEventListener("input", function () { flow.qty = Number(qtyInput.value) || 0; });

    var scanBtn = document.getElementById("flow-scan");
    if (scanBtn) scanBtn.addEventListener("click", function () {
      openScanner(function (loc) {
        flow.section = loc.section || "";
        flow.aisle = loc.aisle || "";
        flow.bay = loc.bay || "";
        flow.shelf = loc.shelf || "";
        renderFlow();
      });
    });

    var confirmBtn = document.getElementById("flow-confirm");
    if (confirmBtn) confirmBtn.addEventListener("click", submitFlow);
  }

  function submitFlow() {
    if (!flow) return;
    var qty = Math.round(Number(flow.qty) || 0);
    if (!qty || qty <= 0) { flowError("Enter a quantity greater than 0."); return; }

    if (flow.kind === "add") {
      var loc = getLocationByParts(flow.section, flow.aisle, flow.bay, flow.shelf);
      if (!loc) { flowError("No location matches that Section-Aisle-Bay-Shelf."); return; }
      applyChange(loc.id, flow.partId, qty, "add").then(function (ok) {
        if (ok) { toast("Added to " + loc.name + "."); closeFlow(); }
      });
      return;
    }

    if (flow.kind === "move") {
      var toLoc = getLocationByParts(flow.section, flow.aisle, flow.bay, flow.shelf);
      if (!toLoc) { flowError("No location matches that Section-Aisle-Bay-Shelf."); return; }
      if (toLoc.id === flow.fromId) { flowError("Choose a different location to move to."); return; }
      applyChange(flow.fromId, flow.partId, -qty, "move out").then(function (ok) {
        if (!ok) return;
        applyChange(toLoc.id, flow.partId, qty, "move in").then(function (ok2) {
          if (ok2) { toast("Moved to " + toLoc.name + "."); closeFlow(); }
          else applyChange(flow.fromId, flow.partId, qty, "move (reverted)");
        });
      });
      return;
    }

    if (flow.kind === "pull") {
      applyChange(flow.fromId, flow.partId, -qty, "pull").then(function (ok) {
        if (ok) closeFlow();
      });
      return;
    }
  }

  document.getElementById("flow-close").addEventListener("click", closeFlow);
  document.getElementById("flow-modal").addEventListener("click", function (e) {
    if (e.target.id === "flow-modal") closeFlow();
  });

  document.getElementById("cycle-close").addEventListener("click", closeCycleModal);
  document.getElementById("cycle-modal").addEventListener("click", function (e) {
    if (e.target.id === "cycle-modal") closeCycleModal();
  });

  // ---------- event delegation ----------
  document.getElementById("view").addEventListener("submit", function (e) {
    var form = e.target.closest("form[data-form]");
    if (!form) return;
    e.preventDefault();
    var kind = form.dataset.form;
    var fd = new FormData(form);

    if (kind === "partSearch") {
      window.location.hash = "#/parts?q=" + encodeURIComponent(fd.get("q") || "");
      return;
    }
    if (kind === "createLocation") {
      var section = (fd.get("section") || "").trim();
      var aisle = (fd.get("aisle") || "").trim();
      var bay = (fd.get("bay") || "").trim();
      var shelf = (fd.get("shelf") || "").trim();
      if (section.length !== 1) {
        toast("Section needs to be exactly 1 character (e.g. \"A\").", true);
        return;
      }
      var badField = [["Aisle", aisle], ["Bay", bay], ["Shelf", shelf]]
        .find(function (f) { return f[1].length !== 2; });
      if (badField) {
        toast(badField[0] + " needs to be exactly 2 characters (e.g. \"01\" or \"A3\").", true);
        return;
      }
      createLocation(section, aisle, bay, shelf, (fd.get("notes") || "").trim());
      return;
    }
    if (kind === "createPart") {
      var pname = (fd.get("name") || "").trim();
      if (!pname) return;
      var photoInput = form.querySelector("input[data-photo]");
      createPart(pname, (fd.get("sku") || "").trim(), (fd.get("description") || "").trim(), photoInput ? photoInput.dataset.compressed : null)
        .then(function (ref) {
          if (ref && ref.id) openAddFlow(ref.id);
        });
      return;
    }
    if (kind === "pull" || kind === "add") {
      var qty = Number(fd.get("qty"));
      if (!qty || qty <= 0) return;
      var delta = kind === "pull" ? -Math.round(qty) : Math.round(qty);
      applyChange(form.dataset.location, form.dataset.part, delta, kind);
      return;
    }
    if (kind === "addExisting") {
      var partId = fd.get("partId");
      var q2 = Number(fd.get("qty"));
      if (!partId || !q2 || q2 <= 0) return;
      applyChange(form.dataset.location, partId, Math.round(q2), "add");
      return;
    }
    if (kind === "updatePart") {
      var uName = (fd.get("name") || "").trim();
      if (!uName) return;
      var uInput = form.querySelector("input[data-photo]");
      var fields = { name: uName, sku: (fd.get("sku") || "").trim() || null, description: (fd.get("description") || "").trim() || null };
      if (uInput && uInput.dataset.compressed) fields.photoDataUrl = uInput.dataset.compressed;
      updatePart(form.dataset.id, fields);
      return;
    }
  });

  document.getElementById("view").addEventListener("click", function (e) {
    var flowBtn = e.target.closest("[data-flow]");
    if (flowBtn) {
      if (flowBtn.dataset.flow === "add") openAddFlow(flowBtn.dataset.part);
      else if (flowBtn.dataset.flow === "move") openMoveFlow(flowBtn.dataset.part);
      return;
    }
    var pullBtn = e.target.closest("[data-pull]");
    if (pullBtn) {
      var qtyInput = document.getElementById("pull-qty-input");
      var qty = qtyInput ? Number(qtyInput.value) || 1 : 1;
      openPullFlow(pullBtn.dataset.pull, qty);
      return;
    }
    if (e.target.id === "cycle-start") { startCycleCount(); return; }
    var delLocBtn = e.target.closest("[data-delete-location]");
    if (delLocBtn) { deleteLocation(delLocBtn.dataset.deleteLocation); return; }
  });

  // Auto-advance focus through the Section-Aisle-Bay-Shelf boxes as each one fills up.
  // Bound to the whole document (not just #view) since the add/move flow's location boxes
  // live in the static flow-modal markup outside #view.
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (!el.classList || !el.classList.contains("loc-part-input")) return;
    var max = Number(el.getAttribute("maxlength")) || 0;
    if (!max || el.value.length < max) return;
    var row = el.closest(".loc-parts-row");
    if (!row) return;
    var inputs = Array.prototype.slice.call(row.querySelectorAll(".loc-part-input"));
    var idx = inputs.indexOf(el);
    if (idx > -1 && idx < inputs.length - 1) inputs[idx + 1].focus();
  });

  window.addEventListener("hashchange", render);

  // ---------- Supabase backend (primary data store) ----------
  function toRow(table, obj) {
    var map = SUPABASE_FIELDS[table], row = {};
    for (var k in map) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) row[map[k]] = obj[k];
    }
    return row;
  }
  function fromRow(table, row) {
    var map = SUPABASE_FIELDS[table], obj = {};
    for (var k in map) obj[k] = row[map[k]];
    if (table !== "inventory" && obj.recentActivity == null) obj.recentActivity = [];
    return obj;
  }

  function SupabaseDB(client) {
    function fetchAndEmit(table, cb, errCb) {
      client.from(table).select("*").then(function (res) {
        if (res.error) { errCb && errCb(res.error); return; }
        var docs = res.data.map(function (row) {
          return { id: row.id, data: function () { return fromRow(table, row); } };
        });
        cb({ docs: docs });
      }).catch(function (e) {
        errCb && errCb(e || new Error("Couldn't reach the database."));
      });
    }

    return {
      collection: function (name) {
        return {
          add: function (obj) {
            return client.from(name).insert(toRow(name, obj)).select().then(function (res) {
              if (res.error) throw res.error;
              var inserted = res.data && res.data[0];
              return { id: inserted ? inserted.id : null };
            });
          },
          onSnapshot: function (cb, errCb) {
            fetchAndEmit(name, cb, errCb);
            var channel = client.channel(name + "-changes")
              .on("postgres_changes", { event: "*", schema: "public", table: name }, function () {
                fetchAndEmit(name, cb, errCb);
              })
              .subscribe(function (status) {
                if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
                  toast("Live updates for " + name + " aren't connected — reload to see others' changes.", true);
                }
              });
            return function unsubscribe() { client.removeChannel(channel); };
          }
        };
      },
      doc: function (path) {
        var parts = path.split("/");
        var table = parts[0], id = parts[1];
        return {
          get: function () {
            return client.from(table).select("*").eq("id", id).maybeSingle().then(function (res) {
              if (res.error) throw res.error;
              return { exists: !!res.data, data: function () { return res.data ? fromRow(table, res.data) : undefined; } };
            });
          },
          set: function (obj) {
            var row = toRow(table, obj);
            row.id = id;
            return client.from(table).upsert(row, { onConflict: "id" }).then(function (res) {
              if (res.error) throw res.error;
            });
          },
          update: function (fields) {
            var row = toRow(table, fields);
            return client.from(table).update(row).eq("id", id).then(function (res) {
              if (res.error) throw res.error;
            });
          },
          delete: function () {
            return client.from(table).delete().eq("id", id).then(function (res) {
              if (res.error) throw res.error;
            });
          }
        };
      }
    };
  }

  // ---------- local fallback storage (used only if the Supabase library fails to load) ----------
  function LocalDB() {
    var STORAGE_KEY = "ci_local_db_v1";
    var data = {};
    var listeners = {};

    function load() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        data = raw ? JSON.parse(raw) : {};
      } catch (e) { data = {}; }
    }
    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }
    function ensure(coll) { if (!data[coll]) data[coll] = {}; }
    function notify(coll) {
      ensure(coll);
      var docs = Object.keys(data[coll]).map(function (id) {
        return { id: id, data: function () { return data[coll][id]; } };
      });
      var snap = { docs: docs };
      (listeners[coll] || []).forEach(function (l) {
        try { l(snap); } catch (e) {}
      });
    }
    function genId() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    load();

    return {
      collection: function (name) {
        ensure(name);
        return {
          add: function (obj) {
            var id = genId();
            data[name][id] = obj;
            persist();
            notify(name);
            return Promise.resolve({ id: id });
          },
          onSnapshot: function (cb, errCb) {
            listeners[name] = listeners[name] || [];
            listeners[name].push(cb);
            setTimeout(function () { notify(name); }, 0);
            return function unsubscribe() {
              listeners[name] = (listeners[name] || []).filter(function (l) { return l !== cb; });
            };
          }
        };
      },
      doc: function (path) {
        var parts = path.split("/");
        var coll = parts[0], id = parts[1];
        ensure(coll);
        return {
          get: function () {
            var exists = Object.prototype.hasOwnProperty.call(data[coll], id);
            return Promise.resolve({ exists: exists, data: function () { return data[coll][id]; } });
          },
          set: function (obj) {
            data[coll][id] = obj;
            persist();
            notify(coll);
            return Promise.resolve();
          },
          update: function (fields) {
            data[coll][id] = Object.assign({}, data[coll][id] || {}, fields);
            persist();
            notify(coll);
            return Promise.resolve();
          },
          delete: function () {
            delete data[coll][id];
            persist();
            notify(coll);
            return Promise.resolve();
          }
        };
      }
    };
  }

  // ---------- boot ----------
  function wireDb() {
    db.collection("locations").onSnapshot(function (snap) {
      state.locations = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.locations = true;
      render();
    }, function (e) { state.ready.locations = true; toast("Locations sync error: " + e.message, true); render(); });

    db.collection("parts").onSnapshot(function (snap) {
      state.parts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.parts = true;
      render();
    }, function (e) { state.ready.parts = true; toast("Parts sync error: " + e.message, true); render(); });

    db.collection("inventory").onSnapshot(function (snap) {
      state.inventory = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.inventory = true;
      render();
    }, function (e) { state.ready.inventory = true; toast("Inventory sync error: " + e.message, true); render(); });
  }

  function boot() {
    render();
    if (window.supabase && window.supabase.createClient) {
      var client;
      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        toast("Couldn't set up the database client (" + e.message + ") — using local-only storage for now.", true);
        db = LocalDB();
        render();
        wireDb();
        return;
      }
      db = SupabaseDB(client);
      render();
      wireDb();
    } else {
      // The Supabase client library didn't load (offline, or the CDN is blocked) —
      // fall back to a browser-local store so the app still works for this one device.
      toast("Couldn't reach the shared database — using local-only storage for now.", true);
      db = LocalDB();
      render();
      wireDb();
    }
  }
})();
</script>

</body></html>
