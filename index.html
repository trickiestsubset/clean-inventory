  // ---------- scanning (QR codes for locations, barcodes for part UPCs) ----------
  // One camera/canvas/decode-loop harness backed by ZXing, which reads both symbologies.
  // scanner.mode picks which formats to decode and which manual-entry fallback to show:
  //   - "location": QR codes only, resolves to a location (used by the add/move/pull flows).
  //   - "barcode": UPC/EAN/etc only, hands the raw text back via onResolve (used by "Scan
  //     barcode" on the New part form to fill in a SKU).
  //   - "any": both, used by the header's general "Scan" button — a location QR opens that
  //     location, a barcode matching a part's SKU opens that part's page.
  // scanner.onResolve, when set, redirects a successful location scan to a callback instead
  // of navigating to it directly.
  var SCAN_FORMATS = {
    location: ["QR_CODE"],
    barcode: ["UPC_A", "UPC_E", "EAN_13", "EAN_8", "CODE_128", "CODE_39", "ITF"],
    any: ["QR_CODE", "UPC_A", "UPC_E", "EAN_13", "EAN_8", "CODE_128", "CODE_39", "ITF"]
  };
  var scanner = { stream: null, rafId: null, active: false, readers: {}, mode: null, onResolve: null, lastScanAt: 0 };
  var scanLibraryPromise = null;

  function loadScanLibrary() {
    if (typeof ZXing !== "undefined") return Promise.resolve();
    if (scanLibraryPromise) return scanLibraryPromise;
    scanLibraryPromise = new Promise(function (resolve, reject) {
      var script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js";
      script.onload = resolve;
      script.onerror = function () { reject(new Error("Scanning library failed to load")); };
      document.head.appendChild(script);
    });
    return scanLibraryPromise;
  }

  function getScanReader(mode) {
    if (scanner.readers[mode]) return scanner.readers[mode];
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, SCAN_FORMATS[mode].map(function (f) { return ZXing.BarcodeFormat[f]; }));
    var reader = new ZXing.BrowserMultiFormatReader(hints);
    scanner.readers[mode] = reader;
    return reader;
  }

  function extractLocationCode(text) {
    if (!text) return null;
    var s = String(text).trim();
    var m = s.match(/#\/l\/([a-z0-9]+)/i);
    if (m) return m[1];
    if (/^[a-z0-9]{3,16}$/i.test(s)) return s;
    return null;
  }

  function useLocation(loc) {
    var onResolve = scanner.onResolve;
    closeScanner();
    if (onResolve) {
      onResolve(loc);
    } else {
      window.location.hash = "#/l/" + loc.code;
      toast("Opened " + loc.name + ".");
    }
  }

  function goToScannedCode(raw) {
    var code = extractLocationCode(raw);
    if (!code) {
      document.getElementById("scan-status").textContent = "That doesn't look like a Clean Inventory location code.";
      return false;
    }
    var loc = getLocationByCode(code);
    if (!loc) {
      document.getElementById("scan-status").textContent = "No location matches that code.";
      return false;
    }
    useLocation(loc);
    return true;
  }

  function goToScannedCodeOrPart(raw) {
    var locCode = extractLocationCode(raw);
    if (locCode) {
      var loc = getLocationByCode(locCode);
      if (loc) {
        useLocation(loc);
        return true;
      }
    }
    var stagingCode = /^ST-[A-Z0-9]{2}$/i.test(String(raw || "").trim()) ? normalizeStagingCode(raw) : null;
    if (stagingCode) {
      closeScanner();
      window.location.hash = stagingHref(stagingCode);
      toast("Opened " + stagingCode + ".");
      return true;
    }
    var order = getOrderByNumber(raw);
    if (order && order.status === "picked") {
      closeScanner();
      openPackingModal(order);
      return true;
    }
    if (order && order.status === "packed") {
      closeScanner();
      openStagingModal(order);
      return true;
    }
    if (order) {
      closeScanner();
      window.location.hash = orderHref(order);
      toast("Opened order " + order.orderNumber + ".");
      return true;
    }
    var part = getPartBySku(raw);
    if (part) {
      closeScanner();
      window.location.hash = "#/parts/" + part.id;
      toast("Opened " + part.name + ".");
      return true;
    }
    document.getElementById("scan-status").textContent = "No location, order, staging location or part matches that code.";
    return false;
  }

  function resolveScan(text) {
    var onResolve = scanner.onResolve;
    closeScanner();
    if (onResolve) onResolve(text);
  }

  function scanTick() {
    if (!scanner.active) return;
    if (typeof ZXing === "undefined") {
      document.getElementById("scan-status").textContent = "Loading the scanning library…";
      scanner.rafId = setTimeout(function () { scanner.rafId = requestAnimationFrame(scanTick); }, 250);
      return;
    }
    var now = Date.now();
    if (now - scanner.lastScanAt < 150) {
      scanner.rafId = requestAnimationFrame(scanTick);
      return;
    }
    scanner.lastScanAt = now;
    var video = document.getElementById("scan-video");
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      try {
        // decode() sizes its internal capture canvas from videoWidth/videoHeight, so it needs
        // the <video> element itself — passing it a plain <canvas> leaves that canvas 0x0.
        var result = getScanReader(scanner.mode).decode(video);
        if (result && result.getText()) {
          if (scanner.mode === "location") {
            if (goToScannedCode(result.getText())) return;
          } else if (scanner.mode === "any") {
            if (goToScannedCodeOrPart(result.getText())) return;
          } else {
            resolveScan(result.getText());
            return;
          }
        }
      } catch (e) {
        // ZXing throws NotFoundException on every frame with nothing recognizable in view — expected, ignore.
      }
    }
    scanner.rafId = requestAnimationFrame(scanTick);
  }

  function openScanner(mode, onResolve) {
    scanner.mode = mode;
    scanner.onResolve = onResolve || null;
    var modal = document.getElementById("scan-modal");
    var status = document.getElementById("scan-status");
    var isLocation = mode === "location";
    var isAny = mode === "any";
    var title = isLocation ? "Scan a location's QR code" : (isAny ? "Scan" : "Scan a barcode");
    var fallbackHint = isLocation ? "enter the location's Section-Aisle-Bay-Shelf" :
      (isAny ? "enter the order number, location code or UPC/part number" : "type the UPC/part number");
    var activeStatus = isLocation ? "Point the camera at a location's QR code." :
      (isAny ? "Point the camera at a location's QR code, an order's barcode or a part's barcode." : "Point the camera at the barcode.");
    document.getElementById("scan-title").textContent = title;
    document.getElementById("scan-manual-form").hidden = !isLocation;
    document.getElementById("barcode-manual-form").hidden = isLocation;
    document.getElementById("barcode-manual-input").placeholder = isAny ? "Enter order number, location code or UPC / part number" : "Enter UPC / part number";
    modal.hidden = false;
    status.textContent = "Loading scanner and requesting camera access…";
    if (isLocation) {
      ["scan-manual-section", "scan-manual-aisle", "scan-manual-bay", "scan-manual-shelf"].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.value = "";
      });
    } else {
      document.getElementById("barcode-manual-input").value = "";
    }

    loadScanLibrary().catch(function () {
      status.textContent = "The scanning library didn't load — " + fallbackHint + " below instead.";
    });

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.textContent = "Camera access isn't available here — " + fallbackHint + " below instead.";
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function (stream) {
      scanner.stream = stream;
      var video = document.getElementById("scan-video");
      video.srcObject = stream;
      video.play().catch(function () {});
      scanner.active = true;
      status.textContent = activeStatus;
      scanner.rafId = requestAnimationFrame(scanTick);
    }).catch(function (e) {
      status.textContent = "Couldn't access the camera (" + e.message + ") — " + fallbackHint + " below instead.";
    });
  }

  function closeScanner() {
    scanner.active = false;
    if (scanner.rafId) cancelAnimationFrame(scanner.rafId);
    if (scanner.rafId) clearTimeout(scanner.rafId);
    scanner.rafId = null;
    scanner.lastScanAt = 0;
    if (scanner.stream) {
      scanner.stream.getTracks().forEach(function (t) { t.stop(); });
      scanner.stream = null;
    }
    var video = document.getElementById("scan-video");
    if (video) video.srcObject = null;
    document.getElementById("scan-modal").hidden = true;
    scanner.onResolve = null;
    scanner.mode = null;
  }

  document.getElementById("scan-fab").addEventListener("click", function () { openScanner("any"); });
  document.getElementById("scan-close").addEventListener("click", closeScanner);
  document.getElementById("scan-modal").addEventListener("click", function (e) {
    if (e.target.id === "scan-modal") closeScanner();
  });
  document.getElementById("scan-manual-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var loc = getLocationByParts(
      document.getElementById("scan-manual-section").value,
      document.getElementById("scan-manual-aisle").value,
      document.getElementById("scan-manual-bay").value,
      document.getElementById("scan-manual-shelf").value
    );
    if (!loc) {
      document.getElementById("scan-status").textContent = "No location matches that Section-Aisle-Bay-Shelf.";
      return;
    }
    useLocation(loc);
  });
  document.getElementById("barcode-manual-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var val = document.getElementById("barcode-manual-input").value.trim();
    if (!val) return;
    if (scanner.mode === "any") goToScannedCodeOrPart(val);
    else resolveScan(val);
  });

  // ---------- add / move / pull flows ----------
  // A part can be stocked at any number of locations at once (inventory rows are keyed by
  // location+part, so the same part having stock in several places is the normal case, not
  // an edge case). These three flows let you add a part to a location, move stock from one
  // location to another, or pull (remove) stock — each via a popup where the location is
  // entered as Section-Aisle-Bay-Shelf (the same four auto-advancing boxes as "Add a
  // location") or resolved by scanning its QR label.
  var flow = null; // { kind: "add" | "move" | "pull", partId, section, aisle, bay, shelf, fromId, qty }
  var cycleCount = null; // { locationId, partId } — the current in-progress cycle count pick, or null

  function getLocationByParts(section, aisle, bay, shelf) {
    var s = (section || "").trim().toUpperCase();
    var a = (aisle || "").trim().toUpperCase();
    var b = (bay || "").trim().toUpperCase();
    var sh = (shelf || "").trim().toUpperCase();
    if (!s || !a || !b || !sh) return null;
    return state.locations.find(function (l) {
      return String(l.section || "").toUpperCase() === s &&
        String(l.aisle || "").toUpperCase() === a &&
        String(l.bay || "").toUpperCase() === b &&
        String(l.shelf || "").toUpperCase() === sh;
    }) || null;
  }

  function flowError(msg) {
    var el = document.getElementById("flow-error");
    if (!el) return;
    el.textContent = msg || "";
    el.hidden = !msg;
  }

  function closeFlow() {
    flow = null;
    document.getElementById("flow-modal").hidden = true;
  }

  function openAddFlow(partId) {
    flow = { kind: "add", partId: partId, section: "", aisle: "", bay: "", shelf: "", qty: 1 };
    renderFlow();
  }

  function openMoveFlow(partId) {
    var locs = locationsForPart(partId);
    if (!locs.length) { toast("Not currently stocked anywhere to move from.", true); return; }
    flow = { kind: "move", partId: partId, fromId: locs[0].location.id, section: "", aisle: "", bay: "", shelf: "", qty: locs[0].quantity };
    renderFlow();
  }

  function openPullFlow(partId, qty) {
    var locs = locationsForPart(partId);
    if (!locs.length) { toast("Not currently stocked anywhere to pull from.", true); return; }
    flow = { kind: "pull", partId: partId, fromId: locs[0].location.id, qty: qty || 1 };
    renderFlow();
  }

  // Pull for a specific order line: pulls from inventory and counts toward that line's picked total.
  function openOrderPullFlow(orderId, partId) {
    var order = state.orders.find(function (o) { return o.id === orderId; });
    var line = order && (order.lines || []).find(function (l) { return l.partId === partId; });
    if (!line) return;
    var remaining = line.quantity - (line.picked || 0);
    if (remaining <= 0) { toast("Nothing left to pick on that line.", true); return; }
    var locs = locationsForPart(partId);
    if (!locs.length) { toast("Not currently stocked anywhere to pull from — use Backorder instead.", true); return; }
    flow = {
      kind: "pull", partId: partId, fromId: locs[0].location.id, qty: Math.min(remaining, locs[0].quantity),
      orderId: orderId, orderNumber: order.orderNumber, remaining: remaining,
      backorderRest: totalForPart(partId) < remaining
    };
    renderFlow();
  }

  function syncFlowBackorderRow() {
    var row = document.getElementById("flow-bo-row");
    if (!row || !flow) return;
    var rest = flow.remaining - (Math.round(Number(flow.qty)) || 0);
    row.hidden = rest <= 0;
    var label = document.getElementById("flow-bo-label");
    if (label) label.textContent = "Backorder the remaining " + Math.max(0, rest);
  }

  function renderFlow() {
    var modal = document.getElementById("flow-modal");
    if (!flow) { modal.hidden = true; return; }
    var part = getPart(flow.partId);
    modal.hidden = false;
    var titleEl = document.getElementById("flow-title");
    var headEl = document.querySelector("#flow-modal .scan-modal-head");
    if (flow.kind === "add") {
      headEl.hidden = true;
    } else {
      headEl.hidden = false;
      titleEl.textContent = (flow.kind === "move" ? "Move " : "Pull ") + (part ? part.name : "this part") + (flow.orderNumber ? " for " + flow.orderNumber : "");
    }

    var locationBoxes =
      '<div class="loc-parts-row">' +
        '<label class="loc-part-field"><span class="loc-part-label">Section</span><input type="text" id="flow-section" class="loc-part-input" maxlength="1" placeholder="X" value="' + esc(flow.section || "") + '" /></label>' +
        '<span class="loc-part-sep">–</span>' +
        '<label class="loc-part-field"><span class="loc-part-label">Aisle</span><input type="text" id="flow-aisle" class="loc-part-input" maxlength="2" placeholder="XX" value="' + esc(flow.aisle || "") + '" /></label>' +
        '<span class="loc-part-sep">–</span>' +
        '<label class="loc-part-field"><span class="loc-part-label">Bay</span><input type="text" id="flow-bay" class="loc-part-input" maxlength="2" placeholder="XX" value="' + esc(flow.bay || "") + '" /></label>' +
        '<span class="loc-part-sep">–</span>' +
        '<label class="loc-part-field"><span class="loc-part-label">Shelf</span><input type="text" id="flow-shelf" class="loc-part-input" maxlength="2" placeholder="XX" value="' + esc(flow.shelf || "") + '" /></label>' +
        '<button class="btn btn-accent btn-sm" type="button" id="flow-scan" style="margin-left:4px;">Scan</button>' +
      '</div>';

    if (flow.kind === "add") {
      document.getElementById("flow-body").innerHTML =
        '<div class="form-grid">' +
          '<div style="display:flex; align-items:center; justify-content:space-between;">' +
            '<label class="hint" style="font-size:1.1em;">Location</label>' +
            '<button class="btn btn-accent btn-sm" type="button" id="flow-close-inline" aria-label="Close">×</button>' +
          '</div>' +
          locationBoxes +
          '<p class="flow-error" id="flow-error" hidden></p>' +
          '<label class="hint">Quantity</label>' +
          '<input type="number" id="flow-qty" min="1" value="' + flow.qty + '" />' +
          '<div class="photo-input-row">' +
            '<input type="file" accept="image/*" data-photo style="display:none;" />' +
            '<button type="button" class="btn btn-accent btn-sm" data-photo-trigger>Add Picture</button>' +
            '<img class="photo-preview" alt="" />' +
          '</div>' +
          '<button class="btn btn-accent" type="button" id="flow-confirm">Add Part</button>' +
        '</div>';
    } else if (flow.kind === "move" || flow.kind === "pull") {
      var locs = locationsForPart(flow.partId);
      var fromSelect =
        '<select id="flow-from">' +
          locs.map(function (r) {
            return '<option value="' + r.location.id + '"' + (r.location.id === flow.fromId ? " selected" : "") + '>' +
              esc(r.location.name) + ' — ' + r.quantity + ' in stock</option>';
          }).join("") +
        '</select>';
      document.getElementById("flow-body").innerHTML =
        '<div class="form-grid">' +
          '<label class="hint">From</label>' + fromSelect +
          (flow.kind === "move" ? '<label class="hint">To</label>' + locationBoxes : "") +
          '<label class="hint">Quantity</label>' +
          '<input type="number" id="flow-qty" min="1" value="' + flow.qty + '" />' +
          (flow.orderId ? '<label id="flow-bo-row" class="hint" style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="flow-bo"' + (flow.backorderRest ? " checked" : "") + ' /> <span id="flow-bo-label"></span></label>' : "") +
          '<p class="flow-error" id="flow-error" hidden></p>' +
          '<button class="btn ' + (flow.kind === "move" ? "btn-accent" : "btn-accent") + '" type="button" id="flow-confirm">' +
            (flow.kind === "move" ? "Move" : "Pull") +
          '</button>' +
        '</div>';
    }

    wireFlow();
  }

  function wireFlow() {
    var sectionInput = document.getElementById("flow-section");
    if (sectionInput) sectionInput.addEventListener("input", function () { flow.section = sectionInput.value; });
    var aisleInput = document.getElementById("flow-aisle");
    if (aisleInput) aisleInput.addEventListener("input", function () { flow.aisle = aisleInput.value; });
    var bayInput = document.getElementById("flow-bay");
    if (bayInput) bayInput.addEventListener("input", function () { flow.bay = bayInput.value; });
    var shelfInput = document.getElementById("flow-shelf");
    if (shelfInput) shelfInput.addEventListener("input", function () { flow.shelf = shelfInput.value; });

    var fromSelect = document.getElementById("flow-from");
    if (fromSelect) fromSelect.addEventListener("change", function () { flow.fromId = fromSelect.value; });

    var qtyInput = document.getElementById("flow-qty");
    if (qtyInput) qtyInput.addEventListener("input", function () { flow.qty = Number(qtyInput.value) || 0; syncFlowBackorderRow(); });
    var boBox = document.getElementById("flow-bo");
    if (boBox) boBox.addEventListener("change", function () { flow.backorderRest = boBox.checked; });
    syncFlowBackorderRow();

    var scanBtn = document.getElementById("flow-scan");
    if (scanBtn) scanBtn.addEventListener("click", function () {
      openScanner("location", function (loc) {
        flow.section = loc.section || "";
        flow.aisle = loc.aisle || "";
        flow.bay = loc.bay || "";
        flow.shelf = loc.shelf || "";
        renderFlow();
      });
    });

    var confirmBtn = document.getElementById("flow-confirm");
    if (confirmBtn) confirmBtn.addEventListener("click", submitFlow);

    var closeInlineBtn = document.getElementById("flow-close-inline");
    if (closeInlineBtn) closeInlineBtn.addEventListener("click", closeFlow);

    var flowPhotoInput = document.querySelector("#flow-body input[data-photo]");
    var flowPhotoTrigger = document.querySelector("#flow-body [data-photo-trigger]");
    if (flowPhotoTrigger && flowPhotoInput) {
      flowPhotoTrigger.addEventListener("click", function () { flowPhotoInput.click(); });
    }
    if (flowPhotoInput) {
      flowPhotoInput.addEventListener("change", function () {
        var file = flowPhotoInput.files && flowPhotoInput.files[0];
        var preview = flowPhotoInput.parentElement.querySelector(".photo-preview");
        if (!file || !flow) return;
        var partId = flow.partId;
        flowPhotoInput.disabled = true;
        compressImage(file).then(function (dataUrl) {
          if (preview) { preview.src = dataUrl; preview.style.display = "inline-block"; }
          return db.doc("parts/" + partId).update({ photoDataUrl: dataUrl });
        }).then(function () {
          toast("Photo saved.");
        }).catch(function () {
          toast("That photo is too large — try a smaller or simpler photo.", true);
          flowPhotoInput.value = "";
        }).finally(function () { flowPhotoInput.disabled = false; });
      });
    }
  }

  function submitFlow() {
    if (!flow) return;
    var qty = Math.round(Number(flow.qty) || 0);
    if (!qty || qty <= 0) { flowError("Enter a quantity greater than 0."); return; }

    if (flow.kind === "add") {
      var loc = getLocationByParts(flow.section, flow.aisle, flow.bay, flow.shelf);
      if (!loc) { flowError("No location matches that Section-Aisle-Bay-Shelf."); return; }
      applyChange(loc.id, flow.partId, qty, "add").then(function (ok) {
        if (ok) { toast("Added to " + loc.name + "."); closeFlow(); }
      });
      return;
    }

    if (flow.kind === "move") {
      var toLoc = getLocationByParts(flow.section, flow.aisle, flow.bay, flow.shelf);
      if (!toLoc) { flowError("No location matches that Section-Aisle-Bay-Shelf."); return; }
      if (toLoc.id === flow.fromId) { flowError("Choose a different location to move to."); return; }
      applyChange(flow.fromId, flow.partId, -qty, "move out").then(function (ok) {
        if (!ok) return;
        applyChange(toLoc.id, flow.partId, qty, "move in").then(function (ok2) {
          if (ok2) { toast("Moved to " + toLoc.name + "."); closeFlow(); }
          else applyChange(flow.fromId, flow.partId, qty, "move (reverted)");
        });
      });
      return;
    }

    if (flow.kind === "pull") {
      if (flow.orderId && qty > flow.remaining) { flowError("Only " + flow.remaining + " left to pick on this order."); return; }
      var pullFlow = flow;
      applyChange(flow.fromId, flow.partId, -qty, "pull").then(function (ok) {
        if (!ok) return;
        closeFlow();
        if (pullFlow.orderId) recordOrderPick(pullFlow.orderId, pullFlow.partId, qty, pullFlow.backorderRest && pullFlow.remaining - qty > 0);
      });
      return;
    }
  }

  document.getElementById("flow-close").addEventListener("click", closeFlow);
  document.getElementById("flow-modal").addEventListener("click", function (e) {
    if (e.target.id === "flow-modal") closeFlow();
  });

  document.getElementById("cycle-close").addEventListener("click", closeCycleModal);
  document.getElementById("cycle-modal").addEventListener("click", function (e) {
    if (e.target.id === "cycle-modal") closeCycleModal();
  });

  // ---------- packages ----------
  // Once every part is verified, the packer says how many packages the order is going out in, by
  // type. Saved on the order as { box, bag, other } counts.
  var PACKAGE_TYPES = [
    { key: "box", one: "Box", many: "Boxes" },
    { key: "bag", one: "Bag", many: "Bags" },
    { key: "other", one: "Other", many: "Other" }
  ];
  function packagesTotal(o) {
    var pk = o && o.packages;
    return pk ? PACKAGE_TYPES.reduce(function (n, t) { return n + (Number(pk[t.key]) || 0); }, 0) : 0;
  }
  function packagesLabel(o) {
    var pk = o && o.packages;
    if (!pk) return "";
    return PACKAGE_TYPES.filter(function (t) { return Number(pk[t.key]) > 0; })
      .map(function (t) { var n = Number(pk[t.key]); return n + " " + (n === 1 ? t.one : t.many); }).join(" \u00b7 ");
  }

  // ---------- packing ----------
  // Verifies a Picked order before it ships. Scanning a Picked order opens this popup: one box per
  // part, and the packer types what they actually counted. The expected quantity is deliberately
  // never shown. A matching count drops that part off the list for good (saved on the order's
  // line as `verified`); a mismatch stays, outlined in red, until it's recounted. When every
  // part has passed, the order becomes Packed.
  var packing = null; // { orderId, counts: { partId: "typed value" }, bad: { partId: true } }

  function openPackingModal(order) {
    if (!order) return;
    if (order.status !== "picked") {
      toast(order.orderNumber + " is " + orderStatusLabel(order.status) + " — it has to be Picked before it can be packed.", true);
      return;
    }
    packing = { orderId: order.id, counts: {}, bad: {}, pkg: { box: "", bag: "", other: "" } };
    renderPackModal();
  }

  function closePackingModal() {
    packing = null;
    document.getElementById("pack-modal").hidden = true;
  }

  function renderPackModal() {
    var modal = document.getElementById("pack-modal");
    var order = packing && state.orders.find(function (o) { return o.id === packing.orderId; });
    if (!order) { modal.hidden = true; return; }
    modal.hidden = false;
    document.getElementById("pack-title").textContent = "Packing " + order.orderNumber;
    var todo = (order.lines || []).filter(function (l) { return !l.verified; });
    if (!todo.length) {
      document.getElementById("pack-body").innerHTML =
        '<p class="hint" style="margin:0 0 12px;">' + esc(order.customerName) + ' — every part checks out. How many packages is this order going out in?</p>' +
        '<div class="form-grid">' + PACKAGE_TYPES.map(function (t) {
          return '<div class="pack-row"><div class="pack-name">' + t.one + '</div>' +
            '<input class="pack-qty" type="number" min="0" inputmode="numeric" autocomplete="off" data-pkg-type="' + t.key + '" value="' + esc(packing.pkg[t.key]) + '" /></div>';
        }).join("") +
        '<p class="flow-error" id="pack-error" hidden></p>' +
        '<button class="btn btn-accent" type="button" id="pack-finish" style="width:100%;">Done packing</button></div>';
      return;
    }
    document.getElementById("pack-body").innerHTML =
      '<p class="hint" style="margin:0 0 12px;">' + esc(order.customerName) + ' — count each part and enter how many you have.</p>' +
      todo.map(function (ln) {
        var part = getPart(ln.partId);
        var val = packing.counts[ln.partId];
        return '<div class="pack-row' + (packing.bad[ln.partId] ? ' bad' : '') + '">' +
          '<div class="pack-name">' + esc(part ? part.name : "Removed part") +
            (part && part.sku ? '<div class="ledger-sku">SKU ' + esc(part.sku) + '</div>' : '') + '</div>' +
          '<input class="pack-qty" type="number" min="0" inputmode="numeric" autocomplete="off" data-pack-part="' + esc(ln.partId) + '" value="' + (val == null ? "" : esc(val)) + '" />' +
        '</div>';
      }).join("") +
      '<button class="btn btn-accent" type="button" id="pack-verify" style="width:100%; margin-top:6px;">Verify</button>';
  }

  function verifyPacking() {
    var order = packing && state.orders.find(function (o) { return o.id === packing.orderId; });
    if (!order) return;
    var lines = (order.lines || []).map(function (l) { return Object.assign({}, l); });
    var passed = 0, failed = 0;
    lines.forEach(function (ln) {
      if (ln.verified) return;
      var raw = packing.counts[ln.partId];
      if (raw == null || String(raw).trim() === "") return; // not counted yet — leave it alone
      if (Math.round(Number(raw)) === ln.quantity) {
        ln.verified = true;
        passed++;
        delete packing.counts[ln.partId];
        delete packing.bad[ln.partId];
      } else {
        packing.bad[ln.partId] = true;
        failed++;
      }
    });
    if (!passed && !failed) { toast("Enter a count for at least one part.", true); return; }
    if (!passed) { renderPackModal(); toast("That doesn't match — recount the highlighted parts.", true); return; }
    saveOrderFields(order, { lines: lines }).catch(function (e) {
      toast("Couldn't save that verification: " + e.message, true);
    });
    renderPackModal();
    if (failed) toast("Recount the highlighted parts.", true);
  }

  // Last step of packing: record the packages, mark the order Packed, and hand it to Staging.
  function finishPacking() {
    var order = packing && state.orders.find(function (o) { return o.id === packing.orderId; });
    if (!order) return;
    var pk = {}, total = 0, bad = false;
    PACKAGE_TYPES.forEach(function (t) {
      var raw = String(packing.pkg[t.key] == null ? "" : packing.pkg[t.key]).trim();
      var n = raw === "" ? 0 : Number(raw);
      if (isNaN(n) || n < 0 || Math.round(n) !== n) bad = true;
      pk[t.key] = n;
      total += n;
    });
    if (bad || total < 1) {
      var err = document.getElementById("pack-error");
      err.textContent = bad ? "Package counts need to be whole numbers." : "Enter at least one package.";
      err.hidden = false;
      return;
    }
    saveOrderFields(order, { packages: pk, status: "packed" }).then(function () {
      closePackingModal();
      openStagingModal(order);
    }).catch(function (e) {
      toast("Couldn't save the packages: " + e.message, true);
    });
  }

  document.getElementById("pack-close").addEventListener("click", closePackingModal);
  document.getElementById("pack-modal").addEventListener("click", function (e) {
    if (e.target.id === "pack-modal") closePackingModal();
  });
  document.getElementById("pack-body").addEventListener("input", function (e) {
    var partId = e.target.dataset && e.target.dataset.packPart;
    if (partId && packing) packing.counts[partId] = e.target.value;
    var pkgType = e.target.dataset && e.target.dataset.pkgType;
    if (pkgType && packing) packing.pkg[pkgType] = e.target.value;
  });
  document.getElementById("pack-body").addEventListener("click", function (e) {
    if (e.target.id === "pack-verify") verifyPacking();
    if (e.target.id === "pack-finish") finishPacking();
  });
  document.getElementById("pack-body").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || !e.target.dataset) return;
    if (e.target.dataset.packPart) { e.preventDefault(); verifyPacking(); }
    else if (e.target.dataset.pkgType) { e.preventDefault(); finishPacking(); }
  });

  // ---------- staging ----------
  // After an order passes packing it's Packed. Shipping prep happens outside the app for now; here
  // the packer puts the finished order in a staging location (ST-XX) to wait for pickup, which
  // moves it to Staging. Shown automatically after the last part is verified, or by scanning /
  // choosing a Packed order.
  var staging = null; // { orderId, code }

  function openStagingModal(order) {
    if (!order) return;
    if (order.status !== "packed") {
      toast(order.orderNumber + " is " + orderStatusLabel(order.status) + " — it has to be Packed before it can be staged.", true);
      return;
    }
    staging = { orderId: order.id, code: "" };
    renderStagingModal();
  }

  function closeStagingModal() {
    staging = null;
    document.getElementById("staging-modal").hidden = true;
  }

  function renderStagingModal() {
    var modal = document.getElementById("staging-modal");
    var order = staging && state.orders.find(function (o) { return o.id === staging.orderId; });
    if (!order) { modal.hidden = true; return; }
    modal.hidden = false;
    document.getElementById("staging-title").textContent = "Staging " + order.orderNumber;
    document.getElementById("staging-body").innerHTML =
      '<div class="order-meta" style="margin-top:0;"><div class="order-customer">' + esc(order.customerName) + '</div>' +
        (order.address ? '<div class="order-address">' + esc(order.address) + '</div>' : '') +
        (packagesLabel(order) ? '<div class="hint">Packages: ' + esc(packagesLabel(order)) + '</div>' : '') + '</div>' +
      '<p class="hint" style="margin:0 0 12px;">Finish prepping this order for shipping, then put it in a staging location.</p>' +
      '<div class="form-grid">' +
        '<label class="hint">Staging location</label>' +
        '<div class="staging-loc">ST-<input type="text" id="staging-code" maxlength="2" placeholder="XX" autocomplete="off" autocapitalize="characters" value="' + esc(staging.code) + '" /></div>' +
        '<p class="flow-error" id="staging-error" hidden></p>' +
        '<button class="btn btn-accent" type="button" id="staging-confirm">Stage order</button>' +
      '</div>';
    var input = document.getElementById("staging-code");
    if (input) input.focus();
  }

  function submitStaging() {
    var order = staging && state.orders.find(function (o) { return o.id === staging.orderId; });
    if (!order) return;
    var code = String(staging.code || "").trim().toUpperCase();
    if (!/^[A-Z0-9]{2}$/.test(code)) {
      var err = document.getElementById("staging-error");
      err.textContent = "A staging location is ST- followed by 2 characters (e.g. ST-04).";
      err.hidden = false;
      return;
    }
    var stagedAt = "ST-" + code;
    saveOrderFields(order, { status: "staging", stagingLocation: stagedAt }).catch(function (e) {
      toast("Couldn't save the staging location: " + e.message, true);
    });
    closeStagingModal();
    toast(order.orderNumber + " staged at " + stagedAt + ".");
  }

  document.getElementById("staging-close").addEventListener("click", closeStagingModal);
  document.getElementById("staging-modal").addEventListener("click", function (e) {
    if (e.target.id === "staging-modal") closeStagingModal();
  });
  document.getElementById("staging-body").addEventListener("input", function (e) {
    if (e.target.id === "staging-code" && staging) staging.code = e.target.value;
  });
  document.getElementById("staging-body").addEventListener("click", function (e) {
    if (e.target.id === "staging-confirm") submitStaging();
  });
  document.getElementById("staging-body").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "staging-code") { e.preventDefault(); submitStaging(); }
  });

  // ---------- closing staged orders ----------
  // The hand-off: the packer confirms they're handing over the right packages, then everything staged
  // at the location is Closed. They type the total package count (never shown to them); if it's
  // wrong they're shown how many of each type should be there, then recount.
  var closing = null; // { code, input, mismatch, step: "count" | "confirm", ids: [...] }

  function openCloseModal(code) {
    if (!ordersStagedAt(code).length) { toast("Nothing is staged at " + code + ".", true); return; }
    closing = { code: code, input: "", mismatch: false, step: "count", ids: [] };
    renderCloseModal();
  }

  function closeCloseModal() {
    closing = null;
    document.getElementById("close-modal").hidden = true;
  }

  function renderCloseModal() {
    var modal = document.getElementById("close-modal");
    if (!closing) { modal.hidden = true; return; }
    var here = ordersStagedAt(closing.code);
    if (!here.length) { closeCloseModal(); return; }
    modal.hidden = false;
    document.getElementById("close-title").textContent = "Close orders at " + closing.code;
    var body = document.getElementById("close-body");

    if (closing.step === "count") {
      var expected = packageTotalsFor(here);
      body.innerHTML =
        '<p class="hint" style="margin:0 0 12px;">Total number of packages:</p>' +
        '<div class="form-grid">' +
          '<input type="number" id="close-count" min="0" inputmode="numeric" autocomplete="off" placeholder="Total packages" value="' + esc(closing.input) + '" />' +
          (closing.mismatch ?
            '<div class="msg-banner" style="margin:0;">Reverify package quantity at ' + esc(closing.code) + '.' +
              PACKAGE_TYPES.filter(function (t) { return expected[t.key] > 0; }).map(function (t) {
                var n = expected[t.key];
                return '<div>' + n + ' ' + (n === 1 ? t.one : t.many).toLowerCase() + '</div>';
              }).join("") + '</div>' : '') +
          '<button class="btn btn-accent" type="button" id="close-check">Confirm count</button>' +
        '</div>';
      var input = document.getElementById("close-count");
      if (input) input.focus();
    } else {
      var ids = closing.ids;
      var list = here.filter(function (o) { return ids.indexOf(o.id) !== -1; });
      body.innerHTML =
        '<p style="margin:0 0 12px;">Package count verified. Close ' + (list.length === 1 ? 'the order' : 'all orders') + ' at <strong>' + esc(closing.code) + '</strong>? The following ' + (list.length === 1 ? 'order will' : 'orders will') + ' be closed:</p>' +
        '<ul class="ledger" style="margin-bottom:14px;">' + list.map(function (o) {
          return '<li class="ledger-row" style="padding:8px 4px;"><div class="ledger-main"><span class="ledger-name">' + esc(o.orderNumber) + '</span>' +
            '<div class="hint">' + esc(o.customerName || "") + '</div></div></li>';
        }).join("") + '</ul>' +
        '<div class="form-row">' +
          '<button class="btn btn-ghost" type="button" id="close-back">Back</button>' +
          '<button class="btn btn-accent" type="button" id="close-confirm">Close orders</button>' +
        '</div>';
    }
  }

  function checkCloseCount() {
    if (!closing) return;
    var here = ordersStagedAt(closing.code);
    var total = PACKAGE_TYPES.reduce(function (n, t) { return n + packageTotalsFor(here)[t.key]; }, 0);
    var raw = String(closing.input || "").trim();
    if (raw === "") { toast("Enter the total number of packages.", true); return; }
    if (Math.round(Number(raw)) !== total) {
      closing.mismatch = true;
      renderCloseModal();
      return;
    }
    closing.mismatch = false;
    closing.step = "confirm";
    closing.ids = here.map(function (o) { return o.id; });
    renderCloseModal();
  }

  function confirmCloseOrders() {
    if (!closing) return;
    var code = closing.code;
    var targets = ordersStagedAt(code).filter(function (o) { return closing.ids.indexOf(o.id) !== -1; });
    if (!targets.length) { closeCloseModal(); return; }
    Promise.all(targets.map(function (o) {
      return saveOrderFields(o, { status: "closed" }).then(function () { return true; }, function () { return false; });
    })).then(function (results) {
      var done = results.filter(Boolean).length;
      closeCloseModal();
      if (done === targets.length) toast(done + " order" + (done === 1 ? "" : "s") + " closed.");
      else toast("Only " + done + " of " + targets.length + " orders closed — try the rest again.", true);
    });
  }

  document.getElementById("close-close").addEventListener("click", closeCloseModal);
  document.getElementById("close-modal").addEventListener("click", function (e) {
    if (e.target.id === "close-modal") closeCloseModal();
  });
  document.getElementById("close-body").addEventListener("input", function (e) {
    if (e.target.id === "close-count" && closing) closing.input = e.target.value;
  });
  document.getElementById("close-body").addEventListener("click", function (e) {
    if (e.target.id === "close-check") checkCloseCount();
    else if (e.target.id === "close-back") { closing.step = "count"; closing.mismatch = false; renderCloseModal(); }
    else if (e.target.id === "close-confirm") confirmCloseOrders();
  });
  document.getElementById("close-body").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "close-count") { e.preventDefault(); checkCloseCount(); }
  });

  // ---------- event delegation ----------
  document.getElementById("view").addEventListener("submit", function (e) {
    var form = e.target.closest("form[data-form]");
    if (!form) return;
    e.preventDefault();
    var kind = form.dataset.form;
    var fd = new FormData(form);

    if (kind === "partSearch") {
      window.location.hash = "#/parts?q=" + encodeURIComponent(fd.get("q") || "");
      return;
    }
    if (kind === "orderBackorder") {
      var boOrder = state.orders.find(function (o) { return o.id === form.dataset.order; });
      var boLine = boOrder && (boOrder.lines || []).find(function (l) { return l.partId === form.dataset.part; });
      var boQty = Math.round(Number(fd.get("qty")));
      if (!boLine || !boQty || boQty <= 0) return;
      var boRemaining = boLine.quantity - (boLine.picked || 0);
      if (boQty > boRemaining) { toast("Only " + boRemaining + " left to pick on that line.", true); return; }
      backorderOrderLine(boOrder, form.dataset.part, boQty).then(function () {
        toast("Backordered " + boQty + ".");
      });
      return;
    }
    if (kind === "stagingSearch") {
      var stCode = normalizeStagingCode(fd.get("code"));
      if (!stCode) { toast("A staging location is ST- followed by 2 characters (e.g. ST-04).", true); return; }
      window.location.hash = stagingHref(stCode);
      return;
    }
    if (kind === "packOrder") {
      var pq = (fd.get("q") || "").trim();
      if (!pq) return;
      var packTarget = getOrderByNumber(pq, true);
      if (!packTarget) { toast("No order matches \"" + pq + "\".", true); return; }
      openPackingModal(packTarget);
      return;
    }
    if (kind === "orderSearch") {
      var oq = (fd.get("q") || "").trim();
      if (!oq) return;
      var foundOrder = getOrderByNumber(oq, true);
      if (foundOrder) window.location.hash = orderHref(foundOrder);
      else toast("No order matches \"" + oq + "\".", true);
      return;
    }
    if (kind === "createOrder") {
      createOrder(
        (fd.get("orderNumber") || "").trim(),
        (fd.get("customerName") || "").trim(),
        (fd.get("address") || "").trim(),
        orderDraft.lines.slice()
      ).then(function (number) {
        if (!number) return;
        orderDraft = { orderNumber: null, customerName: "", address: "", lines: [] };
        window.location.hash = "#/o/" + encodeURIComponent(number);
      });
      return;
    }
    if (kind === "createLocation") {
      var section = (fd.get("section") || "").trim();
      var aisle = (fd.get("aisle") || "").trim();
      var bay = (fd.get("bay") || "").trim();
      var shelf = (fd.get("shelf") || "").trim();
      if (section.length !== 1) {
        toast("Section needs to be exactly 1 character (e.g. \"A\").", true);
        return;
      }
      var badField = [["Aisle", aisle], ["Bay", bay], ["Shelf", shelf]]
        .find(function (f) { return f[1].length !== 2; });
      if (badField) {
        toast(badField[0] + " needs to be exactly 2 characters (e.g. \"01\" or \"A3\").", true);
        return;
      }
      createLocation(section, aisle, bay, shelf, (fd.get("notes") || "").trim());
      return;
    }
    if (kind === "locationSearch") {
      var lsSection = (fd.get("section") || "").trim();
      var lsAisle = (fd.get("aisle") || "").trim();
      var lsBay = (fd.get("bay") || "").trim();
      var lsShelf = (fd.get("shelf") || "").trim();
      var lsFound = getLocationByParts(lsSection, lsAisle, lsBay, lsShelf);
      if (lsFound) {
        window.location.hash = "#/l/" + lsFound.code;
        return;
      }
      toast("No location matches that Section-Aisle-Bay-Shelf.", true);
      return;
    }
    if (kind === "createPart") {
      var pname = (fd.get("name") || "").trim();
      if (!pname) return;
      createPart(pname, (fd.get("sku") || "").trim(), (fd.get("description") || "").trim(), null)
        .then(function (ref) {
          if (ref && ref.id) openAddFlow(ref.id);
        });
      return;
    }
    if (kind === "pull" || kind === "add") {
      var qty = Number(fd.get("qty"));
      if (!qty || qty <= 0) return;
      var delta = kind === "pull" ? -Math.round(qty) : Math.round(qty);
      applyChange(form.dataset.location, form.dataset.part, delta, kind);
      return;
    }
    if (kind === "addExisting") {
      var partId = fd.get("partId");
      var q2 = Number(fd.get("qty"));
      if (!partId || !q2 || q2 <= 0) return;
      applyChange(form.dataset.location, partId, Math.round(q2), "add");
      return;
    }
    if (kind === "updatePart") {
      var uName = (fd.get("name") || "").trim();
      if (!uName) return;
      var uInput = form.querySelector("input[data-photo]");
      var fields = { name: uName, sku: (fd.get("sku") || "").trim() || null, description: (fd.get("description") || "").trim() || null };
      if (uInput && uInput.dataset.compressed) fields.photoDataUrl = uInput.dataset.compressed;
      updatePart(form.dataset.id, fields);
      return;
    }
  });

  document.getElementById("view").addEventListener("click", function (e) {
    var flowBtn = e.target.closest("[data-flow]");
    if (flowBtn) {
      if (flowBtn.dataset.flow === "add") openAddFlow(flowBtn.dataset.part);
      else if (flowBtn.dataset.flow === "move") openMoveFlow(flowBtn.dataset.part);
      return;
    }
    var pullBtn = e.target.closest("[data-pull]");
    if (pullBtn) {
      var qtyInput = document.getElementById("pull-qty-input");
      var qty = qtyInput ? Number(qtyInput.value) || 1 : 1;
      openPullFlow(pullBtn.dataset.pull, qty);
      return;
    }
    var closeOrdersBtn = e.target.closest("[data-close-orders]");
    if (closeOrdersBtn) { openCloseModal(closeOrdersBtn.dataset.closeOrders); return; }
    var stageBtn = e.target.closest("[data-stage-order]");
    if (stageBtn) { openStagingModal(getOrderByNumber(stageBtn.dataset.stageOrder)); return; }
    var packBtn = e.target.closest("[data-pack-order]");
    if (packBtn) { openPackingModal(getOrderByNumber(packBtn.dataset.packOrder)); return; }
    var orderPullBtn = e.target.closest("[data-order-pull]");
    if (orderPullBtn) { openOrderPullFlow(orderPullBtn.dataset.orderPull, orderPullBtn.dataset.part); return; }
    if (e.target.closest("[data-draft-add]")) {
      var dPart = document.getElementById("draft-part");
      var dQty = document.getElementById("draft-qty");
      var dQtyN = Math.round(Number(dQty && dQty.value));
      if (!dPart || !dPart.value) { toast("Choose a part to add.", true); return; }
      if (!dQtyN || dQtyN <= 0) { toast("Enter how many to send.", true); return; }
      var existing = orderDraft.lines.find(function (l) { return l.partId === dPart.value; });
      if (existing) existing.quantity += dQtyN;
      else orderDraft.lines.push({ partId: dPart.value, quantity: dQtyN });
      render();
      return;
    }
    var dRemove = e.target.closest("[data-draft-remove]");
    if (dRemove) { orderDraft.lines.splice(Number(dRemove.dataset.draftRemove), 1); render(); return; }
    if (e.target.id === "cycle-start") { startCycleCount(); return; }
    var delLocBtn = e.target.closest("[data-delete-location]");
    if (delLocBtn) { deleteLocation(delLocBtn.dataset.deleteLocation); return; }
    var delPartBtn = e.target.closest("[data-delete-part]");
    if (delPartBtn) { deletePart(delPartBtn.dataset.deletePart); return; }
    var photoTrigger = e.target.closest("[data-photo-trigger]");
    if (photoTrigger) {
      var photoRow = photoTrigger.closest(".photo-input-row");
      var photoFileInput = photoRow && photoRow.querySelector("input[data-photo]");
      if (photoFileInput) photoFileInput.click();
      return;
    }
    var scanSkuBtn = e.target.closest("[data-scan-sku]");
    if (scanSkuBtn) {
      var skuField = scanSkuBtn.closest("form").querySelector('[name="sku"]');
      openScanner("barcode", function (code) {
        if (skuField) {
          skuField.value = code;
          skuField.focus();
        }
        toast("Scanned barcode " + code + ".");
      });
      return;
    }
  });

  // Auto-advance focus through the Section–Aisle–Bay–Shelf boxes as each one fills up.
  // Bound to the whole document (not just #view) since the add/move flow's location boxes
  // live in the static flow-modal markup outside #view.
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (!el.classList || !el.classList.contains("loc-part-input")) return;
    var max = Number(el.getAttribute("maxlength")) || 0;
    if (!max || el.value.length < max) return;
    var row = el.closest(".loc-parts-row");
    if (!row) return;
    var inputs = Array.prototype.slice.call(row.querySelectorAll(".loc-part-input"));
    var idx = inputs.indexOf(el);
    if (idx > -1 && idx < inputs.length - 1) inputs[idx + 1].focus();
  });

  // Keep the new-order form's text fields in orderDraft so a re-render (e.g. a live sync
  // update from another device) doesn't wipe what's been typed.
  document.getElementById("view").addEventListener("input", function (e) {
    var field = e.target.dataset && e.target.dataset.draft;
    if (field) orderDraft[field] = e.target.value;
  });

  document.getElementById("view").addEventListener("change", function (e) {
    if (e.target.matches && e.target.matches("select[data-order-filter]")) {
      window.location.hash = "#/orders" + (e.target.value ? "?status=" + encodeURIComponent(e.target.value) : "");
    }
  });

  window.addEventListener("hashchange", render);

  // ---------- Supabase backend (primary data store) ----------
  function toRow(table, obj) {
    var map = SUPABASE_FIELDS[table], row = {};
    for (var k in map) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) row[map[k]] = obj[k];
    }
    return row;
  }
  function fromRow(table, row) {
    var map = SUPABASE_FIELDS[table], obj = {};
    for (var k in map) obj[k] = row[map[k]];
    if (table !== "inventory" && table !== "orders" && obj.recentActivity == null) obj.recentActivity = [];
    if (table === "orders" && !Array.isArray(obj.lines)) obj.lines = [];
    return obj;
  }

  function SupabaseDB(client) {
    function fetchAndEmit(table, cb, errCb) {
      client.from(table).select("*").then(function (res) {
        if (res.error) { errCb && errCb(res.error); return; }
        var docs = res.data.map(function (row) {
          return { id: row.id, data: function () { return fromRow(table, row); } };
        });
        cb({ docs: docs });
      }).catch(function (e) {
        errCb && errCb(e || new Error("Couldn't reach the database."));
      });
    }

    return {
      collection: function (name) {
        return {
          add: function (obj) {
            return client.from(name).insert(toRow(name, obj)).select("id").then(function (res) {
              if (res.error) throw res.error;
              var inserted = res.data && res.data[0];
              return { id: inserted ? inserted.id : null };
            });
          },
          onSnapshot: function (cb, errCb) {
            var rows = {};
            var loaded = false;
            var pending = [];
            function applyRows(docs) {
              rows = {};
              docs.forEach(function (doc) {
                rows[doc.id] = toRow(name, doc.data());
                rows[doc.id].id = doc.id;
              });
            }
            function emit() {
              cb({ docs: Object.keys(rows).map(function (id) {
                return { id: id, data: function () { return fromRow(name, rows[id]); } };
              }) });
            }
            // Supabase only includes primary-key columns in the "old" record for
            // deletes unless replica identity is FULL, so don't trust payload.old —
            // resync from the server instead of trying to patch the local cache.
            function resync() {
              fetchAndEmit(name, function (snap) {
                applyRows(snap.docs);
                emit();
              }, errCb);
            }
            fetchAndEmit(name, function (snap) {
              applyRows(snap.docs);
              loaded = true;
              pending.forEach(function (payload) {
                if (payload.eventType === "DELETE") { resync(); return; }
                var changed = payload.new;
                if (changed && changed.id) rows[changed.id] = changed;
              });
              pending = [];
              emit();
            }, errCb);
            var channel = client.channel(name + "-changes")
              .on("postgres_changes", { event: "*", schema: "public", table: name }, function (payload) {
                if (!loaded) {
                  pending.push(payload);
                  return;
                }
                if (payload.eventType === "DELETE") {
                  resync();
                  return;
                }
                var changed = payload.new;
                if (!changed || !changed.id) return;
                rows[changed.id] = changed;
                emit();
              })
              .subscribe(function (status) {
                if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
                  toast("Live updates for " + name + " aren't connected — reload to see others' changes.", true);
                }
              });
            return function unsubscribe() { client.removeChannel(channel); };
          }
        };
      },
      doc: function (path) {
        var parts = path.split("/");
        var table = parts[0], id = parts[1];
        return {
          get: function () {
            return client.from(table).select("*").eq("id", id).maybeSingle().then(function (res) {
              if (res.error) throw res.error;
              return { exists: !!res.data, data: function () { return res.data ? fromRow(table, res.data) : undefined; } };
            });
          },
          set: function (obj) {
            var row = toRow(table, obj);
            row.id = id;
            return client.from(table).upsert(row, { onConflict: "id" }).then(function (res) {
              if (res.error) throw res.error;
            });
          },
          update: function (fields) {
            var row = toRow(table, fields);
            return client.from(table).update(row).eq("id", id).then(function (res) {
              if (res.error) throw res.error;
            });
          },
          delete: function () {
            return client.from(table).delete().eq("id", id).then(function (res) {
              if (res.error) throw res.error;
            });
          }
        };
      }
    };
  }

  // ---------- local fallback storage (used only if the Supabase library fails to load) ----------
  function LocalDB() {
    var STORAGE_KEY = "ci_local_db_v1";
    var data = {};
    var listeners = {};

    function load() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        data = raw ? JSON.parse(raw) : {};
      } catch (e) { data = {}; }
    }
    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }
    function ensure(coll) { if (!data[coll]) data[coll] = {}; }
    function notify(coll) {
      ensure(coll);
      var docs = Object.keys(data[coll]).map(function (id) {
        return { id: id, data: function () { return data[coll][id]; } };
      });
      var snap = { docs: docs };
      (listeners[coll] || []).forEach(function (l) {
        try { l(snap); } catch (e) {}
      });
    }
    function genId() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    load();

    return {
      collection: function (name) {
        ensure(name);
        return {
          add: function (obj) {
            var id = genId();
            data[name][id] = obj;
            persist();
            notify(name);
            return Promise.resolve({ id: id });
          },
          onSnapshot: function (cb, errCb) {
            listeners[name] = listeners[name] || [];
            listeners[name].push(cb);
            setTimeout(function () { notify(name); }, 0);
            return function unsubscribe() {
              listeners[name] = (listeners[name] || []).filter(function (l) { return l !== cb; });
            };
          }
        };
      },
      doc: function (path) {
        var parts = path.split("/");
        var coll = parts[0], id = parts[1];
        ensure(coll);
        return {
          get: function () {
            var exists = Object.prototype.hasOwnProperty.call(data[coll], id);
            return Promise.resolve({ exists: exists, data: function () { return data[coll][id]; } });
          },
          set: function (obj) {
            data[coll][id] = obj;
            persist();
            notify(coll);
            return Promise.resolve();
          },
          update: function (fields) {
            data[coll][id] = Object.assign({}, data[coll][id] || {}, fields);
            persist();
            notify(coll);
            return Promise.resolve();
          },
          delete: function () {
            delete data[coll][id];
            persist();
            notify(coll);
            return Promise.resolve();
          }
        };
      }
    };
  }

  // ---------- boot ----------
  function wireDb() {
    db.collection("locations").onSnapshot(function (snap) {
      state.locations = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.locations = true;
      scheduleRender();
    }, function (e) { state.ready.locations = true; toast("Locations sync error: " + e.message, true); scheduleRender(); });

    db.collection("parts").onSnapshot(function (snap) {
      state.parts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.parts = true;
      scheduleRender();
    }, function (e) { state.ready.parts = true; toast("Parts sync error: " + e.message, true); scheduleRender(); });

    db.collection("orders").onSnapshot(function (snap) {
      state.orders = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.orders = true;
      scheduleRender();
    }, function (e) { state.ready.orders = true; toast("Orders sync error: " + e.message + " (has the orders table been created?)", true); scheduleRender(); });

    db.collection("inventory").onSnapshot(function (snap) {
      state.inventory = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.ready.inventory = true;
      scheduleRender();
    }, function (e) { state.ready.inventory = true; toast("Inventory sync error: " + e.message, true); scheduleRender(); });
  }

  function boot() {
    render();
    if (window.supabase && window.supabase.createClient) {
      var client;
      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        toast("Couldn't set up the database client (" + e.message + ") — using local-only storage for now.", true);
        db = LocalDB();
        render();
        wireDb();
        return;
      }
      db = SupabaseDB(client);
      render();
      wireDb();
    } else {
      // The Supabase client library didn't load (offline, or the CDN is blocked) —
      // fall back to a browser-local store so the app still works for this one device.
      toast("Couldn't reach the shared database — using local-only storage for now.", true);
      db = LocalDB();
      render();
      wireDb();
    }
  }
})();
</script>
